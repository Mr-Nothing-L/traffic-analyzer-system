# =============================================================================
# Prompt Templates Configuration
# =============================================================================
# Reusable prompt templates for VLM calls.
# Each template uses Jinja2 syntax for variable substitution.
#
# 模板顺序与 event_categories.yaml 中的 event_id 对应：
#   1. scene_understanding — 先验知识生成参考（v2.0.0 不再被 pipeline 自动调用）
#   2. illegal_parking_detection — event_id 0
#   3. emergency_lane_occupancy_detection — event_id 1
#   4. traffic_accident_detection — event_id 2
#   5. pedestrian_detection — event_id 3
#   6. non_motor_vehicle_detection — event_id 4
#   7. heavy_congestion_detection — event_id 5
#   8. road_construction_detection — event_id 6
#   9. direct_reversing_detection — event_id 7
#   10. thrown_object_detection — event_id 8
#   11. lane_change_solid_detection — event_id 9 (is_active=false)
# =============================================================================

prompt_templates:
  # ---------------------------------------------------------------------------
  # 1. Scene Understanding — 先验知识（纯规则，不生成 JSON）
  # ---------------------------------------------------------------------------

  - template_id: "scene_understanding"
    name: "场景先验规则"
    system_prompt: |
      你正在分析中国高速公路监控画面。以下规则是所有事件检测的前提，分析车辆行为前必须先确定道路结构和流向。
    user_prompt: |
      =============================================================================
      方向判定规则（直接应用，不要重新推断）
      =============================================================================

      规则 1 — 双向主路+中央隔离带（中国高速公路默认情况）：
      - 如果视频显示两条由中央隔离带（护栏、栅栏、绿化带或混凝土隔离墩）分隔的主路：
        - 左侧道路（画面左侧道路）：来向车流，车辆朝向摄像头移动（从远到近，逐渐变大）→ normal_direction = "toward_bottom"
        - 右侧道路（画面右侧道路）：去向车流，车辆远离摄像头移动（从近到远，逐渐变小）→ normal_direction = "toward_top"
        - direction_confidence = 1.0
        - direction_reasoning = "双向主路+隔离带，默认左侧来向右侧去向"
      - 这是默认假设。仅当看到明确相反证据时才可覆盖。

      规则 2 — 匝道（入口/出口）：
      - 如果匝道汇入或驶出主路：
        - 匝道方向与其连接的主路方向相同。
        - 如果匝道在主路左侧 → normal_direction = "toward_bottom"（与左侧主路相同）。
        - 如果匝道在主路右侧 → normal_direction = "toward_top"（与右侧主路相同）。
        - direction_confidence = 0.9
        - direction_reasoning = "匝道与所在主路同向"

      规则 3 — 单条主路或单条匝道：
      - 当画面中只有单条主路、单条匝道或同向多车道匝道时，应优先依据道路几何、车道线走向、匝道汇入/驶出方向、车辆连续位移和透视关系判断 normal_direction。
      - 如果画面中只有一辆车，不要仅凭该车车头/车尾判断 normal_direction，也不要仅凭该车运动方向直接定义正常流向。
      - 对单车场景，应综合判断：
        1. 道路或匝道从画面远处到近处的延伸方向；
        2. 车道线、路肩线和道路边界的走向；
        3. 车辆是否沿车道方向连续移动；
        4. 车辆移动时是否符合透视变化：靠近摄像头通常变大，远离摄像头通常变小；
        5. 该车辆是否位于正常车道，而不是路肩、应急车道或施工区域。
      - 在常见高速监控视角下，画面上方通常较远，画面下方通常较近：
        - 车辆从画面上方向下方移动并逐渐变大，可支持 normal_direction = toward_bottom；
        - 车辆从画面下方向上方移动并逐渐变小，可支持 normal_direction = toward_top。
      - 如果车道结构清楚，且车辆沿车道连续移动、透视变化合理，可给 direction_confidence = 0.6-0.8。
      - 如果道路结构不清、车头/车尾不清、只有单辆车且透视变化不明显，应给 direction_confidence = 0.4-0.6，并在 reasoning 中说明 normal_direction 不确定。

      摄像头视角参考：
        - 在常见高速公路监控视角下，画面上方通常表示远处，车辆看起来较小；画面下方通常表示近处，车辆看起来较大。
        - toward_bottom 表示车辆在画面中从上向下移动；如果车辆同时逐渐变大，通常说明车辆正在靠近摄像头。
        - toward_top 表示车辆在画面中从下向上移动；如果车辆同时逐渐变小，通常说明车辆正在远离摄像头。
        - 车辆大小变化只是透视辅助证据，不能单独决定 normal_direction。
        - 对于弯道、匝道、斜向道路、摄像头非正向拍摄或画面透视不明显的场景，车辆可能不是严格沿画面上下方向移动，此时应优先根据道路几何、车道线方向、车辆头尾朝向和多辆正常车辆的连续运动方向判断。
        - 如果出现"向上移动但变大"或"向下移动但变小"的情况，说明常规透视假设可能不适用，应降低置信度，不要仅凭大小变化得出 normal_direction。


      =============================================================================
      应急车道识别规则
      =============================================================================

      核心原则：以视觉特征（白色实线分隔 + 最外侧）为主，位置规则为辅。

      位置规则（相对中央隔离带，非绝对画面边缘）：
      - 应急车道始终在每条道路的"外侧边缘"（离中央隔离带最远的一侧）。
      - 中国高速公路为右行制：
        - 左侧主路（toward_bottom）：中央隔离带在右，应急车道在该道路的最左侧。
        - 右侧主路（toward_top）：中央隔离带在左，应急车道在该道路的最右侧。
        - 匝道出入口处车道结构复杂，不要仅凭"画面最左/最右"判断，必须结合连续实线、导流区标线、匝道几何形态和车辆通行路径。

      匝道出入口特殊判断：
      - 匝道出入口可能同时存在入口匝道、出口匝道、加速车道、减速车道、分流/汇流车道、导流区和路肩/应急车道。
      - 白色/黄色斜纹、网状实线、鱼骨线、三角形或楔形分流鼻端区域属于应急车道占用检测范围。
      - 白色实线分隔的最外侧路肩/应急区域属于应急车道；即使旁边存在匝道、加速车道或减速车道，也需要结合区域边界判断。
      - 出口匝道、入口匝道、加速车道、减速车道、分流/汇流车道本身属于正常通行区域，不应直接视为应急车道。
      - 车辆沿匝道方向正常行驶、排队、缓行或短暂停车，且未进入应急车道/路肩或导流区/分流鼻端时，不属于应急车道占用。

      视觉特征（满足任意一类即可作为候选）：
      - 应急车道/路肩：位于道路最外侧，在最后一条正常通行车道之外，紧挨护栏、路缘或道路边界。
      - 应急车道/路肩：与正常通行车道由连续白色实线分隔，不是虚线、渐变线或正常匝道分合流标线。
      - 应急车道/路肩：有隆声带、凸起标线或"应急车道"标志。
      - 导流区/分流鼻端：位于主路与匝道之间，表现为白色/黄色斜纹、网状实线、鱼骨线、三角形或楔形禁行区域。
      - 车辆部分或完全进入上述应急车道/路肩、导流区、鱼骨线区域、网状实线区域或分流鼻端，均可作为应急车道占用候选。

      排除项：
      - 两条主车道之间的白虚线/实线 = 车道边界，不是应急车道。
      - 出口匝道、入口匝道、加速车道、减速车道、分流/汇流车道内的正常行驶、排队、缓行或短暂停车，不属于应急车道占用。
      - 车辆只是靠近道路右侧、靠近匝道口、靠近实线，但仍处于正常车道或匝道通行路径中，不属于应急车道占用。
      - 锥桶临时封闭区域、收费站/服务区宽路肩、施工封闭作业区，不直接按普通应急车道占用判断。




  # ---------------------------------------------------------------------------
  # 2. Illegal Parking Detection (event_id=0)
  # Purpose: Detect vehicles that have come to a complete stop on the roadway.
  # ---------------------------------------------------------------------------
  - template_id: "illegal_parking_detection"
    name: "Illegal Parking Detection"
    system_prompt: |
      你是一名高速公路交通监控分析师，专门检测违法停车事件。输出必须是合法 JSON，不含其他文本。
    user_prompt: |
      检测这些视频帧中的违法停车事件。

      定义 — 违法停车：
      机动车在道路上持续静止的交通事件。
      - 事件发生区域包括：行车道（主车道）、应急车道、导流区、路肩
      - 只要车辆在上述区域静止停放，即构成违法停车

      检查步骤：
        1. 逐帧观察视频，扫描所有道路上的车辆。
        2. 判断每辆车是否静止。通过对比多帧中车辆相对于路面标线、护栏等固定参照物的位置变化来判断。
        3. 对静止车辆，记录：
           - 车辆类型、颜色
           - 所在区域（行车道/应急车道/导流区/路肩）
           - 静止持续时间（如可判断）
        4. 以下情况仍需报告违停：
           - 施工区域内的静止车辆
           - 应急车道上的静止车辆

      返回 JSON:
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <秒>,
            "end_time_sec": <秒>,
            "evidence_frames": [<帧>],
            "description": "<区域+颜色+车型+静止状态>",
            "reasoning": "发现<车辆特征>，位于<区域>，相对于<固定参照物>位置未发生变化 → 判定为静止 → 违法停车"
          }
        ],
        "summary": "<总体评估>"
      }

      未检测到时：{"detected": false, "instances": [], "summary": "未检测到违法停车。"}

      重要：
      - 所有文本字段使用中文。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 3. Emergency Lane Occupancy Detection (event_id=1)
  # ---------------------------------------------------------------------------
  - template_id: "emergency_lane_occupancy_detection"
    name: "应急车道占用检测"
    system_prompt: |
      你是一名交通监控分析师。你的唯一任务是检测应急车道上的车辆占用情况。
    user_prompt: |
      检测视频帧中的应急车道占用情况。

      定义 — 应急车道占用：
      任何车辆（行驶、停止、停放、部分进入）在应急车道（路肩）或导流区、鱼骨线区域内，即构成占用。
      匝道场景注意区分正常汇入汇出口与最边缘的白色实线的应急车道。
      若白色实线连接着虚线，则说明该实线不是应急车道边缘，即使压线也不能认定为应急车道闯入。

      检查步骤：
      1. 判断应急车道位置（通常在画面最左或最右侧，紧挨护栏）。
      2. 检查应急车道区域，注意远距离目标和部分压线车辆。
      3. 发现车辆后，记录类型、颜色、位置。


      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
      - 应急车道占用判断要先确认区域归属，再判断车辆行为。
      - 车辆明确进入应急车道/路肩，或进入导流区、鱼骨线区域、网状实线区域、分流鼻端区域，需要报告detected=true。
      - 即使只有一辆车部分进入应急车道/路肩或导流区/分流鼻端，也必须报告 detected=true。
      - 正常匝道、加速车道、减速车道、分流/汇流车道内的车辆不要判定为应急车道占用。
      - 如果区域边界不清楚，不要仅凭"靠右/靠边/低速/停车"报告 detected=true，应结合车道线、导流线和通行路径判断。
      
      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <秒>,
            "end_time_sec": <秒>,
            "evidence_frames": [<帧>],
            "description": "<车辆类型、颜色、在应急车道上的位置>",
            "reasoning": "<车辆位置描述>"
          }
        ],
        "summary": "<总体评估>"
      }

      未检测到时：{"detected": false, "instances": [], "summary": "未检测到应急车道占用。"}


  # ---------------------------------------------------------------------------
  # 4. Traffic Accident Detection (event_id=2)
  # ---------------------------------------------------------------------------
  - template_id: "traffic_accident_detection"
    name: "交通事故检测"
    system_prompt: |
      你是一名专业的高速公路交通监控分析师。你的任务是检测视频中的交通事故事件。
    user_prompt: |
      检测这些视频帧中的交通事故事件。

      定义 — 交通事故：
      交通事故是指在高速公路上发生的涉及车辆损坏、人员伤亡或道路障碍的突发事件。以下情况均属于交通事故：
      - **车辆碰撞**：追尾、侧面碰撞、多车连环相撞、刮擦等
      - **道路散落物/障碍物**：因事故产生的车辆碎片、货物散落等阻塞车道
      - **车辆翻车/侧翻**：车辆翻倒、侧翻、仰翻
      - **车辆起火/冒烟**：车辆燃烧、冒烟、有明火


      检查步骤：
      1. 扫描视频帧，寻找事故视觉特征：车辆损坏、异常姿态、烟雾火焰、散落物、多车聚集、救援车辆到场。
      2. 对疑似事故确认：是否真事故（排除正常停车）、事故类型、涉及车辆、是否阻塞车道。
      3. 有救援车辆但看不到事故本身时谨慎判断。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <大致开始时间（秒）>,
            "end_time_sec": <大致结束时间（秒）>,
            "evidence_frames": [<帧索引>],
            "description": "<观察到的内容：事故类型、涉及车辆、损坏程度、位置>",
            "reasoning": "<简要说明：看到的视觉证据、事故类型判断>"
          }
        ],
        "summary": "<总体评估：事故严重程度、影响范围、涉及车辆数>"
      }

      如果未检测到交通事故，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到交通事故。"
      }

      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
      - 救援车辆到场本身不是事故证据，需结合其他视觉线索判断。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 5. Pedestrian Detection (event_id=3)
  # ---------------------------------------------------------------------------
  - template_id: "pedestrian_detection"
    name: "Pedestrian Detection"
    system_prompt: |
      你是一名专业的高速公路交通监控分析师。你的任务是检测视频中高速公路上的行人。
    user_prompt: |
      检测这些视频帧中高速公路上的行人。

      定义 — 高速公路行人出现：
      高速公路是禁止行人进入的封闭交通区域。以下情况均属于高速公路行人出现事件：
      - **行人**：在高速公路车道、路肩、中央隔离带、匝道等**路面**上行走或站立的普通人
      - **穿越高速公路者**：试图横穿高速公路车道的人员

      常见误报源识别：
      - **路侧标志牌**：固定不动的矩形物体，通常有文字或图案
      - **桥梁阴影**：横跨画面的深色阴影带，随时间缓慢移动
      - **植被/树木**：在画面边缘摇摆的植物，通常有绿色或棕色
      - **中央隔离带护栏反光片**：规则排列的小型反光点
      - **动物**：四足行走的动物不属于行人事件（但可能触发交通事故）
      - **骑摩托车/电动车/自行车/三轮车的人**：只要人处于骑乘姿态、坐在两轮/三轮车辆上并在道路上行驶，就不属于行人事件，应属于摩托车/非机动车事件（event_id=4）。即使 rider 穿着反光背心或清晰可见，也不得标注为行人。
      - **机动车内人员**：坐在轿车、SUV、货车、客车等四轮机动车内的人员不属于行人事件。

      检查步骤：
      1. 扫描视频帧，寻找人形轮廓。
      2. 对每个人形轮廓确认：
         - 是否真人类；
         - 是否在路面/路肩上（站在车上未落地则排除）；
         - 是否处于骑乘姿态、坐在摩托车/电动车/自行车/三轮车上：若是，则排除，不标注为行人；
         - 是否在四轮机动车内：若是，则排除。
      3. 即使行人穿着反光背心、工作服等特殊行人，也需要标注。
      4. 描述行人的位置、行为、穿着特征。注意远距离和部分遮挡目标。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <大致开始时间（秒）>,
            "end_time_sec": <大致结束时间（秒）>,
            "evidence_frames": [<帧索引>],
            "description": "<观察到的内容：行人位置、行为、穿着、人数>",
            "reasoning": "<简要说明：人形特征确认、位置>"
          }
        ],
        "summary": "<总体评估：共发现多少行人，分布在什么位置，有无危险行为>"
      }

      如果未检测到行人，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到高速公路行人。"
      }

      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。

    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 5a. Far Non-motor ROI Detection (helper for event_id=4)
  # ---------------------------------------------------------------------------
  - template_id: "far_non_motor_roi_detection"
    name: "远距离非机动车批量 ROI 检测"
    system_prompt: |
      你是一名高速公路交通监控分析师。你的任务是检测单帧图像中远距离可疑的非机动车（摩托车、电动车、自行车、三轮车等），并输出归一化 bbox。
    user_prompt: |
      输入为单帧高速公路监控图像。

      任务：找出画面中远距离、可疑的非机动车目标。

      输出 JSON：
      {
        "bbox_norm": [<x1, y1, x2, y2>] 或 null,
        "occluded": <true|false>,
        "confidence": "<high|medium|low>",
        "reason": "<选择理由>"
      }

      如果没有可疑目标：
      {
        "bbox_norm": null,
        "occluded": false,
        "confidence": "low",
        "reason": "<未发现理由>"
      }

      提示：
      - `bbox_norm` 取值范围 [0.0, 1.0]，x1 < x2，y1 < y2。
      - 目标应在道路区域（车道、应急车道、路肩等）。
      - 不要把护栏、阴影、反光点、普通四轮车当作目标。
      - 仅排除前景中**固定的**金属杆、支架、摄像头外壳、立柱、雨刷、电线、标识牌杆等固定遮挡物；不要仅因远处小目标轮廓与这些物体外形近似就泛化排除。

      遮挡与置信度：
      - 如果目标被电线杆、护栏、其他车辆遮挡导致只露出部分车身，或看起来是四轮车残部，必须设置 occluded=true 且 confidence=low。
      - 如果能清晰看到完整两轮/三轮轮廓和骑乘姿态，设置 occluded=false 且 confidence=high。
      - 如果目标较远、细节模糊但疑似非机动车，设置 occluded=false 且 confidence=medium。

      示例（发现候选）：
      {"bbox_norm": [0.75, 0.10, 0.78, 0.15], "occluded": false, "confidence": "high", "reason": "画面右上角远处应急车道边缘有黑色狭长轮廓，疑似骑乘姿态，位于道路区域"}
      {"bbox_norm": [0.48, 0.05, 0.52, 0.09], "occluded": false, "confidence": "medium", "reason": "画面远处道路尽头有一个深色小轮廓，位于车道内，尺寸和形状均不同于四轮车，可能是远距离非机动车"}

      示例（无候选）：
      {"bbox_norm": null, "occluded": false, "confidence": "low", "reason": "画面远处均为护栏与路面反光，未见位于道路区域的可疑小目标"}
      {"bbox_norm": null, "occluded": false, "confidence": "low", "reason": "画面中的车辆均为普通四轮机动车，没有明显小于四轮车的可疑目标"}

      重要：
      - 仅输出一个最可疑的远距离非机动车 bbox。
      - 所有文本字段使用中文。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 5b. Far Non-motor Motion Verification (helper for event_id=4)
  # ---------------------------------------------------------------------------
  - template_id: "far_non_motor_motion_verification"
    name: "远距离非机动车运动反射验证"
    system_prompt: |
      你是一名高速公路交通监控分析师，擅长通过对比相邻帧判断目标是否移动。
    user_prompt: |
      输入为两张放大的相邻帧 ROI 图像的横向拼接：
      - 左侧：当前帧红色方框内的区域放大图
      - 右侧：相邻帧（前一帧或后一帧）同一位置红色方框内的区域放大图

      任务：判断红色方框内的目标在两帧之间是否发生明显变化或移动。

      输出 JSON：
      {
        "is_moving": <true|false>,
        "reason": "<判断理由>"
      }

      判断标准：
      - 如果方框内的物体位置、形状、姿态、阴影在两帧间有明显变化，说明它在移动，is_moving=true
      - 如果方框内的物体几乎不变（只是背景/路面/护栏/井盖/标志牌阴影），is_moving=false
      - 高速公路上的移动小型物体更可能是非机动车（摩托车、电动车等）

      示例：
      {"is_moving": true, "reason": "右侧相邻帧中框内目标位置明显向左移动，轮廓姿态发生变化，说明是移动目标"}
      {"is_moving": false, "reason": "两帧中框内均为同一位置的路面反光点，形状和位置几乎无变化，为静态物体"}

      重要：
      - 仅判断框内目标是否移动，不要输出 bbox。
      - 所有文本字段使用中文。
    output_format_hint: "JSON"
    enable_far_object_enhancement: false

  # ---------------------------------------------------------------------------
  # 6. Non-motor / Two-wheel Vehicle Detection (event_id=4)
  # ---------------------------------------------------------------------------
  - template_id: "non_motor_vehicle_detection"
    name: "Non-motor Vehicle Detection"
    system_prompt: |
      你是一名专业的高速公路交通监控分析师。你的任务是判断合成图像红色方框内是否为非机动车（摩托车、电动车、自行车、三轮车）。
    user_prompt: |
      输入为 1-2 张合成图像：
      - 第一张（如果有）：左侧为原视频帧，右侧红色方框区域为远距离可疑目标的放大图。
      - 第二张（如果有）：左侧为当前帧红色方框内区域的进一步放大图，右侧为相邻帧同一位置的放大图，用于观察目标是否移动及形态变化。

      任务：判断红色方框内是否为高速公路上的非机动车（摩托车、电动车、自行车、三轮车）。

      输出 JSON：
      {
        "detected": <true|false>,
        "reason": "<判断理由>"
      }

      判定为非机动车必须同时满足：
      1. 红色方框内是摩托车、电动车、自行车或三轮车；
      2. 放大后能看到至少一项明确的车辆结构证据，例如：两个圆形车轮、车把、车座、车架、骑乘者的人影/上半身轮廓/头盔、车灯、尾灯、车牌等；
      3. 目标高度明显大于宽度（宽高比 < 1:1），呈细长轮廓；
      4. 仅凭宽高比或尺寸符合不能判定为非机动车，必须有可辨识的结构证据。

      以下情况必须排除（detected=false）：
      - 汽车、SUV、货车、客车、面包车等四轮机动车
      - 工程车辆、压路机、沥青摊铺机、挖掘机、起重机、清扫车、水泥搅拌车等异形车辆
      - 施工区域内的车辆或人员（周围有交通锥、隔离栏、施工标志牌、工程车辆、反光背心人员）
      - 护栏边缘穿反光背心的施工人员或养护人员
      - 路面反光点、阴影、污渍、交通标志牌、井盖等静态物体
      - 前景中的监控摄像头、支架、立柱、雨刷、电线、标识牌杆等固定遮挡物
      - 红框内只是一团无结构的暗斑、黑块、阴影、模糊色块，无法确认车身结构的
      - 夜间远处仅有一个亮点、光斑或反光点，看不到车身轮廓的
      - 只是一个小黑点或无法确认车身结构的模糊目标

      如果红色方框内不是非机动车，或无法确认，必须返回 detected=false。

      如果未检测到，返回：
      {
        "detected": false,
        "reason": "<未发现理由>"
      }

      所有文本字段使用中文。
    output_format_hint: "JSON"
    enable_far_object_enhancement: true

  # ---------------------------------------------------------------------------
  # 7. Heavy Congestion Detection (event_id=5)
  # ---------------------------------------------------------------------------
  - template_id: "heavy_congestion_detection"
    name: "严重拥堵检测"
    system_prompt: |
      你是一名交通监控分析师。你的任务是检测高速公路上的严重交通拥堵事件。
    user_prompt: |
      检测这些视频帧中是否存在交通拥堵。

      定义 — 交通拥堵：
      交通拥堵是指高速公路上的车辆通行能力显著下降、车速明显降低、车辆排队长度较长的交通状态。与正常车流密集不同，拥堵具有以下特征：
      - 车辆平均速度相比正常高速公路通行速度显著降低（如降至30km/h以下或接近停滞）
      - 车辆密度极高，车间距极小（车头时距明显小于正常跟车距离）
      - 出现明显的走走停停（stop-and-go）交通模式
      - 单/多车道车辆排队长度延伸较远，形成长队列
      - 车道占有率远超正常通行能力
      - 车辆在多车道上均呈现缓慢移动或静止状态
      - 出入匝道口拥堵也属于交通拥堵

      视觉特征（必须综合判断）：
      - 车辆密度高，几乎首尾相接
      - 车辆间距小，几乎没有超车空间
      - 走走停停模式：部分帧中车辆静止，部分帧中缓慢移动
      - 车辆队列向画面远处延伸，排队长度较长
      - 多/单车道出现缓慢通行

      重要 — 区分规则（必须严格遵守）：
      2. **严重拥堵的核心判断标准**：车速明显下降（视觉上车辆移动极其缓慢或几乎停滞）+ 车辆排队延伸较远。两者缺一不可。
      5. **单车道缓慢 = 拥堵**：仅单车道车辆缓慢而其他车道通行正常，判定为严重拥堵。

      检查步骤：
      1. 观察所有车道的车辆运动状态。
      2. 对比早帧和晚帧中同一车辆的位置变化，判断车辆是否停滞或极低速。
      3. 观察车辆队列长度和多车道状态。
      4. 综合判断是否为拥堵，**单个车道拥堵也属于拥堵事件**。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <float>,
            "end_time_sec": <float>,
            "evidence_frames": [<int>],
            "description": "<中文描述：拥堵位置、涉及车道、排队长度、车辆状态等>",
            "reasoning": "<简要说明：车速观察结果、排队长度、涉及车道、是否排除事故导致的拥堵>"
          }
        ],
        "summary": "<中文总体评估：是否检测到严重拥堵，拥堵程度描述，涉及范围>"
      }

      如果未检测到严重交通拥堵，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到严重交通拥堵。"
      }

      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
  
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 8. Road Construction Detection (event_id=6)
  # ---------------------------------------------------------------------------
  - template_id: "road_construction_detection"
    name: "道路施工检测"
    system_prompt: |
      你是一名交通监控分析师。检测活跃的道路施工或维护作业区。
    user_prompt: |
      检测这些视频帧中的道路施工/维护作业区。

      定义 — 以下情况认定为道路施工：
      **可见的交通锥或隔离栏布置**（形成作业区、车道封闭或交通引导区域），并且**至少满足以下两项**：
          - 穿着高可视性服装的工人（橙色、黄色或荧光绿色背心/帽子）
          - 工程/施工车辆或设备（沥青摊铺机、压路机、水泥搅拌车、挖掘机、自卸卡车、起重机等）
          - 由**锥桶/隔离栏**布置明确指示的车道封闭或交通引导（区域封闭，引导）。
          - 锥桶为必须物。


      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <大致开始时间>,
            "end_time_sec": <大致结束时间>,
            "evidence_frames": [<帧索引>],
            "description": "<观察到的内容：工人、设备、锥桶布置>",
            "reasoning": "<简要说明：看到的施工特征（锥桶/工人/设备）和缺失项，判定为施工或非施工的理由>"
          }
        ],
        "summary": "<总体评估>"
      }

      如果事件中**不存在**施工，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到道路施工。"
      }

      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
      - 务必保守。如果不确定是施工还是日常清洁，报告 detected=false 并说明原因。

  # ---------------------------------------------------------------------------
  # 9. Direct Reversing Detection (event_id=7, expert_agent)
  # ---------------------------------------------------------------------------
  - template_id: "direct_reversing_detection"
    name: "直接逆行/倒车检测"
    system_prompt: |
      你是一名交通监控分析师，检测逆行/倒车车辆。输出必须是合法 JSON，不含其他文本。
    user_prompt: |
      检测视频帧中的逆行/倒车车辆。

      分析步骤：
        1. 扫描视频帧中所有车辆。
        2. 对每辆车，对比多帧中该车相对于路面标线、护栏、路牌等固定参照物的位置变化，判断实际运动方向。
        3. 对比实际运动方向与所在道路正常流向：
           - 方向相反 → 判定为逆行，计入 instances
           - 方向一致 → 判定为正常，不计入 instances
        4. 仅当存在方向相反的车辆时，设置 detected=true。
        5. 静止车辆不判定逆行。

      道路流向规则：
      不要以目标在视频中的绝对像素坐标判断其所在车流，要以中间护栏为边界：
      - 左侧道路（画面下方来车）：正常流向 toward_bottom（靠近摄像头 = dy>0）
      - 右侧道路（画面上方来车）：正常流向 toward_top（远离摄像头 = dy<0）
      - 匝道汇入汇出口车流方向与主路相同

      返回 JSON（不要包含 markdown 代码块）：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <秒>,
            "end_time_sec": <秒>,
            "evidence_frames": [<帧>],
            "description": "<位置+颜色+车型>",
            "reasoning": "检查<车辆特征>，位于<道路位置> → 对比<帧A>和<帧B>中相对于<固定参照物>的位置变化 → 运动方向<方向> vs 正常流向<流向> → <一致/相反> → <正常/逆行>"
          }
        ],
        "summary": "<总体评估>"
      }

      未检测到时：{"detected": false, "instances": [], "summary": "未检测到逆行车辆。"}

      重要：
      - 所有文本字段使用中文。
      - 务必保守。仅在确认车辆实际运动方向与道路正常流向相反时才报告 detected=true。
      - 如果所有车辆运动方向均正常，必须返回 detected=false。
      - **不要仅通过车头朝向判断逆行**，要以车辆相对于固定参照物的实际位移方向为准。
      - 静止车辆不判定逆行。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 10. Thrown Object Detection (event_id=8)
  # ---------------------------------------------------------------------------
  - template_id: "thrown_object_detection"
    name: "抛洒物检测"
    system_prompt: |
      你是一名交通监控分析师。你的任务是检测车道内可能影响车辆正常通行的抛洒物。
    user_prompt: |
      检测这些视频帧中的抛洒物（遗落至车道内的异物）。

      定义 — 抛洒物：
      抛洒物是指遗落、掉落或抛洒至高速公路车道内，可能对车辆正常通行造成干扰或安全隐患的物体。抛洒物可以是静止在路面上的，也可以是正在空中飘落的。

      抛洒物包括但不限于：
      - 塑料袋、编织袋、纸张、布料等轻质物品
      - 瓶子、罐子、包装盒等容器类物品
      - 木板、金属片、轮胎碎片等硬质物品
      - 泥土、砂石、建筑材料等散状物品
      - 衣物、被褥、绳索等其他杂物
      - 任何不属于道路正常组成部分的异物

      视觉特征：
      - 车道内出现与路面颜色/纹理明显不同的异物
      - 车道内有反光、飘动、滚动或静止的异常物体
      - 空中飘落的物品（塑料袋、纸张等）
      - 车辆附近突然出现的飞溅物或掉落物

      重要 — 包含规则（以下情况按抛洒物处理）：
      1. **三角警示牌等标识牌的异常状态**：三角牌、警示牌等在无提醒作用时按抛洒物处理。例如：倒在地上、不在事故车辆后方正常放置、被风吹倒等。
      2. **施工物品散落至施工区域外**：施工时的物品（如锥桶、施工标志牌、工具等）如果散落到施工区域以外的车道内，按抛洒物处理。
      3. **小动物/牲畜**：进入车道内的动物按抛洒物处理。

      检查步骤：
      1. 扫描各车道路面区域（包括中央、分界线附近、远处、边缘、车辆前后），寻找与路面颜色/纹理不一致的异物。
      2. 帧间对比：观察物体是否位置变化、突然出现或消失。
      3. 注意小目标（可能只有10x10像素），关注颜色/纹理/形状/运动异常。
      4. 排除正常设施（路面标线、井盖、排水口等）。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <float>,
            "end_time_sec": <float>,
            "evidence_frames": [<int>],
            "description": "<中文描述：抛洒物类型、颜色、大小、所在车道位置、状态（静止/滚动/飘落等）>",
            "reasoning": "<简要说明：发现位置、与路面差异特征、帧间变化>"
          }
        ],
        "summary": "<中文总体评估：是否检测到抛洒物，涉及数量和类型，对交通的潜在影响>"
      }

      如果未检测到抛洒物，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到抛洒物。"
      }

      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
      - 即使只有很小的可疑物体，也要报告 detected=true。
      - 抛洒物通常很小，在720p缩放下可能只有10x10像素，需要特别注意。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 11. Lane Change on Solid Line Detection (event_id=9, is_active=false)
  # ---------------------------------------------------------------------------
  - template_id: "lane_change_solid_detection"
    name: "实线变道检测"
    system_prompt: |
      你是一名交通监控分析师。你的任务是检测车辆跨越实线变道的违规行为。
    user_prompt: |
      检测这些视频帧中是否存在车辆跨越实线（白色或黄色实线）变道的违规行为。

      定义 — 实线变道违规：
      实线变道违规是指车辆在行驶过程中，主动跨越禁止变道的实线标线（白色实线或黄色实线）从一个车道驶入另一个车道的行为。

      车道标线类型说明：
      - **实线（白色或黄色）**：表示禁止变道区域，车辆不得跨越实线变道。
      - **虚线/断续线（白色）**：表示允许变道区域，车辆在确保安全的前提下可以变道。
      - **虚实线（一侧实线一侧虚线）**：虚线侧车辆可以变道，实线侧车辆禁止变道。
      - **导流线（V形/斜线填充区域）**：属于禁止压线区域，车辆不得压越导流线。

      视觉特征：
      - 车辆从一条车道完整跨越至另一条车道
      - 车辆跨越的是白色或黄色实线（非虚线）
      - 车辆的行驶轨迹明显穿过实线标线
      - 变道过程中车辆有明显的横向位移

      重要 — 区分规则（必须严格遵守）：
      1. **正常行驶中的车轮偶尔压线 ≠ 实线变道**：
         - 车辆正常行驶时车轮短暂接触或略微压过车道线，但车身主体仍在原车道内 → **不判定**为实线变道。
         - 车辆因道路弯曲、避让障碍物等原因短暂压线但立即回到原车道 → **不判定**为实线变道。
         - 只有车辆**主动、完整地从一条车道跨越至另一条车道**才算实线变道。
      2. **虚线变道 ≠ 实线变道**：跨越虚线/断续线的正常变道**不判定**为违规。
      3. **导流线压越**：车辆压越或跨越导流线（V形/斜线填充区域）**判定**为实线变道违规。
      4. **应急车道边界实线**：从主车道跨越实线进入应急车道，或从应急车道跨越实线进入主车道，**判定**为实线变道违规。
      5. **匝道汇入/汇出**：匝道车辆汇入主路时跨越虚线或渐变段标线 → **不判定**为违规；但跨越实线强行汇入 → **判定**为违规。
      6. **多帧确认**：必须在多帧中观察到车辆从原车道完整进入目标车道，单帧中的疑似压线不足以判定。

      检查步骤：
      1. 识别画面中的所有车道标线，区分实线和虚线。
      2. 追踪每辆车的行驶轨迹，特别关注：
         - 车辆是否从一条车道移动到另一条车道
         - 跨越的是实线还是虚线
         - 变道是否完整（车身大部分进入新车道）
      3. 对疑似实线变道的车辆，执行以下验证：
         a. **起始帧**：记录车辆在原始车道的位置（车身主体在哪条车道）。
         b. **中间帧**：观察车辆是否正在跨越车道线，记录跨越的是实线还是虚线。
         c. **结束帧**：确认车辆是否已完整进入目标车道（车身主体在新车道内）。
         d. **排除正常压线**：如果车辆只是车轮短暂压线但车身仍在原车道 → 排除。
         e. **排除虚线变道**：确认跨越的是实线（连续不间断的线）而非虚线。
      4. 记录违规车辆的类型、颜色、所在道路、跨越的实线类型（白实线/黄实线/导流线）。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <float>,
            "end_time_sec": <float>,
            "evidence_frames": [<int>],
            "description": "<中文描述：违规车辆类型、颜色、从哪条车道跨越至哪条车道、跨越的实线类型、所在道路>",
            "reasoning": "<简要说明：起始帧和结束帧车辆位置、跨越的标线类型（实线/虚线）、变道是否完整、排除正常压线的理由>"
          }
        ],
        "summary": "<中文总体评估：是否检测到实线变道违规，涉及车辆数量，违规类型分布>"
      }

      如果未检测到实线变道违规，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到实线变道违规。"
      }

      重要：
      - 所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
      - 严格区分"正常行驶压线"和"主动变道跨越实线"，前者不判定为违规。
      - 注意导流线、虚实线等特殊标线情况。
      - 保持保守。仅在多帧确认车辆完整跨越实线变道后才报告。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 12. Adjudication — 事件汇总裁决
  # ---------------------------------------------------------------------------
  - template_id: "adjudication"
    name: "事件汇总裁决"
    system_prompt: |
      你是一名专业的高速公路交通事件汇总专家。你的任务是基于以下专家Agent的初步检测结果、关键帧图像以及业务规则，对交通事件进行最终裁决。

      核心原则：
      1. 每位专家只负责事实识别（看到什么就报什么），不做排除判断。
      2. 当专家报告与业务规则冲突时，以业务规则为准。
      3. 必须将排除原因记录在 audit_log 中，确保裁决过程可审计。
      4. 保持客观，不做主观推测。
      5. **自我一致性检查**：如果某位专家的 detected=true，但其 summary 明确说"未检测到"或"没有"，或其所有 instances 的 reasoning 都描述的是正常情况（如"正常行驶"、"未进入应急车道"、"方向一致"等），则该专家的 detected 字段与其自身推理矛盾，应视为 detected=false 并排除。

    user_prompt: |
      请对以下专家初步检测结果进行最终裁决。

      =============================================================================
      1. 专家初步检测结果
      =============================================================================

      {{ candidates_json }}

      =============================================================================
      2. 业务规则
      =============================================================================

      {{ business_rules }}

      =============================================================================
      3. 标注规范（来自标注文档）
      =============================================================================

      {{ annotation_spec }}

      =============================================================================
      4. 视觉验证指令
      =============================================================================

      以下事件总结时，可以根据专家结论，从提供的视频帧中寻找对应依据：

      - **应急车道占用**：检查目标车辆周围是否有施工区域标识（交通锥、隔离栏、工程车辆、穿着反光背心的作业人员、施工标志牌、车道封闭设施）。如果车辆明确位于施工区域内或被施工设施包围，必须排除该应急车道占用事件。不要出现类似“尽管可能是工程作业车辆，但其位置确实占用了应急车道。”的描述
      - **违停**：检查静止车辆周围是否有事故相关证据（车辆损坏、散落物、烟雾、多车聚集）。如果属于事故现场的一部分，只保留交通事故事件，排除违停。
        特别注意：施工区域内的静止机动车（包括工程车、作业车辆）不构成施工事件的豁免理由，必须保留违停事件。不得以"属于正常施工保障作业"为由排除违停。
      - **行人闯入**：
        - 普通行人、滞留人员、在高速公路车道/路肩/应急车道行走或站立的人员，原则上保留为行人事件。
        - 仅在**道路施工事件确实成立（event_id=6 detected=true）**，且该人员明确位于由交通锥、隔离栏、施工标志牌等布置界定的施工区域内执行施工任务时，才可排除。
        - 单纯穿着反光背心、在工程车旁、捡垃圾、日常清洁、养护巡查、手持工具但未形成施工作业区，**不构成排除行人事件的理由**。
        - 如果 event_id=6 detected=false，则不得以“属于合法施工/养护作业”为由排除行人事件。
      - **逆行**：检查车辆是否为施工区域内正常作业的工程车辆（压路机、沥青摊铺机等往返移动）。如果是，必须排除。
      - **非机动车闯入**: 以原始专家结论为准，裁决层不做兜底复核。即使提供的视频帧中目标视觉特征模糊，只要专家Agent报告 detected=true，就必须保留为 detected=true。仅在专家自身推理明确否认存在非机动车时，才可排除。

      注意：每位专家只负责识别自己领域的事实（例如应急车道占用专家只报告"车辆在应急车道上"，不会标注周围是否有施工区域），其他信息需要你在裁决时对照图片自行判断。

      =============================================================================
      5. 裁决任务
      =============================================================================

      请基于以上专家检测结果、业务规则和视觉验证，做出最终裁决：

      请按以下 JSON 格式输出裁决结果：

      强制指令：`event_results` 数组必须**仅包含** `candidates_json` 中提供的候选事件。对于候选事件中未被实际检测到的事件，必须设置 `detected=false` 并保留其 `event_id` 和 `event_name`。不得编造 `candidates_json` 列表之外的事件 ID。
      {% if previously_missing_event_ids %}
      注意：你上一次的输出遗漏了 event_id={{ previously_missing_event_ids }}，本次必须补齐这些事件。
      {% endif %}

      {
        "event_results": [
          {
            "event_id": <int>,
            "event_name": "<事件名称>",
            "detected": <true|false>,
            "summary": "<最终裁决摘要>",
            "instances": [
              {
                "start_time_sec": <float>,
                "end_time_sec": <float>,
                "evidence_frames": [<int>],
                "description": "<实例描述>",
                "reasoning": "<裁决理由>"
              }
            ]
          }
        ],
        "audit_log": [
          {
            "event_id": <int>,
            "event_name": "<事件名称>",
            "action": "excluded|included",
            "reason": "<排除或保留的详细原因>",
            "rule_id": "<引用的业务规则编号，若无则填 null>"
          }
        ],
        "adjudication_reasoning": "<总体裁决推理：说明整体判断逻辑、主要冲突如何解决、关键决策依据>",
        "reasoning_chain": [
          {
            "event_id": <int>,
            "event_name": "<事件名称>",
            "decision": "<保留/排除>",
            "thought_process": "<各个事件的思考过程>",
            "basis": "<引用的规则或证据>"
          }
        ]
      }

      重要：
      - 所有文本字段必须使用中文书写。
      - 保持客观，依据视觉证据和提供的业务规则进行判断。
      - audit_log 必须覆盖所有被排除的事件，不能遗漏。

    output_format_hint: "JSON"
