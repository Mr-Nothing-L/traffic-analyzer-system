# =============================================================================
# event_id 7 — 车辆逆行/倒车检测
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # 9. Direct Reversing Detection (event_id=7, expert_agent)
  # ---------------------------------------------------------------------------
  - template_id: "direct_reversing_detection"
    name: "直接逆行/倒车检测"
    system_prompt: |
      你是一名交通监控分析师，检测逆行/倒车车辆。输出必须是合法 JSON，不含其他文本。所有文本字段必须使用中文。
    user_prompt: |
      检测视频帧中的逆行/倒车车辆。

      分析步骤：
        1. 扫描视频帧中所有车辆。
        2. 对每辆车，对比多帧中该车相对于路面标线、护栏、路牌等固定参照物的位置变化，判断实际运动方向。
        3. 对比实际运动方向与所在道路正常流向：
           - 方向相反 → 判定为逆行，计入 instances
           - 方向一致 → 判定为正常，不计入 instances
        4. 仅当存在方向相反的车辆时，设置 detected=true。
        5. 静止车辆不判定逆行。

      道路流向规则：
      不要以目标在视频中的绝对像素坐标判断其所在车流，要以中间护栏为边界：
      1. 首先根据画面道路几何、车道线走向、多数正常车辆的连续位移方向推断每条道路的正常流向（normal_direction）。
      2. 常见双向主路+中央隔离带场景（默认假设，仅当证据不足时使用）：
         - 左侧道路：正常流向 toward_bottom（靠近摄像头 = dy>0）
         - 右侧道路：正常流向 toward_top（远离摄像头 = dy<0）
      3. 匝道汇入汇出口车流方向与其连接的主路相同。
      4. 对于弯道、匝道、斜向道路、摄像头非正向拍摄或透视不明显的场景，不要套用默认左右规则，应依据实际道路几何和车辆运动推断。

      返回 JSON（不要包含 markdown 代码块）：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <秒>,
            "end_time_sec": <秒>,
            "evidence_frames": [<整数帧号，例如 15, 16, 17>],
            "description": "<位置+颜色+车型>",
            "reasoning": "检查<车辆特征>，位于<道路位置> → 对比<帧A>和<帧B>中相对于<固定参照物>的位置变化 → 运动方向<方向> vs 正常流向<流向> → <一致/相反> → <正常/逆行>"
          }
        ],
        "summary": "<总体评估>"
      }

      完整示例（仅供参考格式）：
      {
        "detected": true,
        "instances": [
          {
            "start_time_sec": 6,
            "end_time_sec": 12,
            "evidence_frames": [15, 16, 17],
            "description": "左侧道路，红色小轿车",
            "reasoning": "检查红色小轿车，位于左侧道路 → 对比第15帧和第17帧中相对于护栏的位置变化 → 运动方向远离摄像头 vs 正常流向靠近摄像头 → 相反 → 逆行"
          }
        ],
        "summary": "视频左侧道路存在一辆红色小轿车逆行。"
      }

      未检测到时：{"detected": false, "instances": [], "summary": "未检测到逆行车辆。"}

      重要：
      - 务必保守。仅在确认车辆实际运动方向与道路正常流向相反时才报告 detected=true。
      - 如果所有车辆运动方向均正常，必须返回 detected=false。
      - **不要仅通过车头朝向判断逆行**，要以车辆相对于固定参照物的实际位移方向为准。
      - 静止车辆不判定逆行。
    output_format_hint: "JSON"

