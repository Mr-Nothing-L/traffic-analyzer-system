# =============================================================================
# SFT Forge — 基于文件名真值的多轮纠错 SFT label 生成模板
# =============================================================================
# 三个模板组成双向纠错链路(设计:docs/superpowers/specs/2026-10-22-sft-forge-design.md):
#   sft_forge_forward         正向盲推(不注入真值,保证思维链真实性);
#   sft_forge_correct_missing 漏检纠错:告知该事件经人工标注确认存在,要求重新
#                             观察并输出该事件的肯定思考;
#   sft_forge_review_extra    误检复核:附事件定义与首轮思考要求严格复核,
#                             verdict=confirm / false_positive;09 正常真值按
#                             空事件集合进入此复核,使用专用证据要求文案。
# 模型输出为结构化 JSON(与 sft_rewrite.yaml 同模式:该端点 qwen3.8 在
# enable_thinking=False 时 chat template 预填 <think></think>,不会输出字面
# 标签,<think>/<answer> 训练格式由 sftforge/merger.py 代码重建,段落正文保持
# 模型原文)。最终样本与 lora27b_v15_mnt4096.jsonl 对齐:think 按
# 1..8、10、11 共 10 类事件逐段,answer 含 天气/时间/场景/最终结论/classN 列表。
# 加载:core/config_manager.py _load_prompt_templates 按 prompts/*.yaml glob;
# 调用:traffic_analyzer/sftforge/engine.py(SftForgeEngine)。
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # Round 0: 正向盲推
  # ---------------------------------------------------------------------------
  - template_id: "sft_forge_forward"
    name: "SFT Forge 正向盲推(视频直传)"
    system_prompt: |
      你是一名高速公路交通事件分析专家,正在为模型训练撰写标注思考素材。

      硬纪律(必须严格遵守):
      1. 你只能描述视频中实际可见的内容;看不清或看不到的目标必须明说无法辨认,严禁编造颜色、车型、位置等细节。
      2. 全部内容使用中文。
      3. 只输出一个合法 JSON 对象,不要输出思考过程说明、Markdown 代码块或任何额外文字。
    user_prompt: |
      输入为一段完整的高速公路监控视频(非抽帧)。请完整观看后,对下列 10 类交通事件逐一分析,输出结构化思考素材;最终的 <think>/<answer> 训练样本由程序拼装,你只需输出本模板规定的 JSON。

      事件定义(判定条件必须严格遵守):
      {{ event_definitions }}

      event_thoughts 填写规则:
      - 恰好 10 条,event_id 1..8、10、11 每类一条,按 event_id 升序排列。
      - present:该事件是否在视频中检出(true/false)。
      - 检出(present=true)的事件:thinking 先写一句概要(位置+事件主体),然后按「观察：…分析：…结论：…」三段展开——观察段描述相关区域内可见目标的外观、位置与类型;分析段描述时序变化(目标是否移动、移动方向、是否停留、与周围车流的关系);结论段给出该类事件的小结。
      - 未检出(present=false)的事件:thinking 写 2~4 句——先扫描与该事件相关的画面区域并描述实际看到的内容,再对照判定条件说明为何不满足。各类事件的理由不得套用同一句模板,要各自落到画面实际内容上。

      weather / time_of_day / scene 填写规则:
      - weather:晴天/雨天/雾天/雪天/阴天,任选其一。
      - time_of_day:白天/夜间/晨昏,任选其一。
      - scene:基本交通场景描述(不含任何事件描述),需说明:是否有匝道/导流区/收费口;隧道还是高速场景;是否有来向车道;是否有去向车道;车流量大/中/小。

      输出 JSON 格式(仅返回一个 JSON 对象,不要 Markdown 代码块):
      {
        "weather": "晴天",
        "time_of_day": "白天",
        "scene": "高速公路双向主路场景,无匝道/导流区/收费口,有来向车道与去向车道,车流量中等。",
        "event_thoughts": [
          {"event_id": 1, "present": false, "thinking": "扫描各行车道与应急车道,画面中车辆均处于持续行驶状态,帧间位置明显前移,无任何机动车由行驶转为静止,不满足违停的发生条件。"},
          {"event_id": 2, "present": true, "thinking": "去向一侧应急车道内有小型车占用。观察：画面最右侧白色实线以外为应急车道,去向一侧应急车道内可见一辆白色小车,车身完整。分析：该车在连续多帧中位置不变,保持静止,周围车流均正常驶过。结论：一辆白色小车静止于去向一侧应急车道内,构成应急车道占用。"}
        ]
      }
      (event_thoughts 必须包含 event_id 1..8、10、11 共 10 条,上面仅示例 2 条。)

      直接输出 JSON,不要输出任何自然语言解释、分析步骤或思考过程。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 漏检纠错: 补单个事件思考
  # ---------------------------------------------------------------------------
  - template_id: "sft_forge_correct_missing"
    name: "SFT Forge 漏检定向重推"
    system_prompt: |
      你是一名高速公路交通事件分析专家。你的首轮分析漏检了一类经人工标注确认存在的事件,现在需要针对该类事件重新仔细观察视频并补写思考素材。

      硬纪律(必须严格遵守):
      1. 该事件的存在性已由人工标注确认,不得否定;你的任务是找到它在画面中的可见证据并如实描述。
      2. 你只能描述视频中实际可见的内容,严禁编造看不清的细节。
      3. 全部内容使用中文,只输出一个合法 JSON 对象,不要 Markdown 代码块或任何额外文字。
    user_prompt: |
      输入为一段完整的高速公路监控视频(非抽帧)。

      经人工标注确认,本视频确实存在以下事件,而你的首轮分析未能检出:
      事件:class{{ event_id }} {{ event_name }}
      判定定义:
      {{ event_definition }}

      请重新完整观看视频,重点寻找该事件的可见证据(特别注意远处、画面深处的小目标,以及应急车道/导流区等边缘区域),然后输出该类事件的思考素材:
      - 先写一句概要(位置+事件主体),然后按「观察：…分析：…结论：…」三段展开(观察=目标外观/位置/类型;分析=时序变化与周围车流关系;结论=该类事件小结)。

      输出 JSON 格式(仅返回一个 JSON 对象,不要 Markdown 代码块):
      {"thinking": "{{ event_name }}的完整思考段落"}
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 误检复核: 确认或剔除
  # ---------------------------------------------------------------------------
  - template_id: "sft_forge_review_extra"
    name: "SFT Forge 误检定向复核"
    system_prompt: |
      你是一名高速公路交通事件分析专家。你的首轮分析检出了一类事件,但人工标注的真值中并不包含该类事件,现在需要你严格对照判定定义复核首轮结论。

      硬纪律(必须严格遵守):
      1. 你只能依据视频中实际可见的内容复核,严禁编造细节;首轮结论可能是错的,不得为了维护首轮结论而强行确认。
      2. 全部内容使用中文,只输出一个合法 JSON 对象,不要 Markdown 代码块或任何额外文字。
    user_prompt: |
      输入为一段完整的高速公路监控视频(非抽帧)。

      {% if normal_ground_truth %}
      经人工复核,本视频为 class09 正常,即 class1~8、class10、class11 均未发生。
      你的首轮分析检出了 class{{ event_id }} {{ event_name }},与“正常”真值冲突。请将该检出作为疑似误报,重新完整观看视频并严格复核。
      {% else %}
      你的首轮分析检出了以下事件,但人工标注真值中不存在该类事件,请复核是否属于误报:
      {% endif %}
      事件:class{{ event_id }} {{ event_name }}
      判定定义:
      {{ event_definition }}

      首轮分析中该类事件的思考:
      {{ first_round_segment }}

      {% if normal_ground_truth %}
      正常样本复核要求:逐项核对事件定义中的主体、位置、时序变化和排除条件。不得仅凭“看起来像”“可能是”、单一瞬间或局部外观维持检出;证据不足或不完整时输出 false_positive。只有全部必要条件均有清晰可见的证据时才输出 confirm。不得为了维护首轮结论而强行确认,也不得编造画面细节。
      {% endif %}

      请重新完整观看视频,严格对照判定定义逐条复核首轮思考中的证据,然后输出:
      - verdict:"confirm"(复核后事件确实成立)或 "false_positive"(确属误报,应予剔除);
      - thinking:verdict 为 confirm 时按「观察：…分析：…结论：…」给出肯定段落;为 false_positive 时写 2~4 句否定段落(说明首轮的"证据"实际是什么、为何不满足判定条件)。

      输出 JSON 格式(仅返回一个 JSON 对象,不要 Markdown 代码块):
      {"verdict": "confirm", "thinking": "复核段落"}
    output_format_hint: "JSON"
