# =============================================================================
# event_id 3 — 高速公路行人出现检测（含远距离 ROI 辅助模板）
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # 5a. Far Pedestrian ROI Detection (helper for event_id=3)
  # ---------------------------------------------------------------------------
  - template_id: "far_pedestrian_roi_detection"
    name: "远距离行人批量 ROI 检测"
    system_prompt: |
      你是一名高速公路交通监控分析师。你的任务是检测单帧图像中远距离可疑的行人目标，并输出归一化 bbox。
      所有文本字段必须使用中文。
    user_prompt: |
      输入为单帧高速公路监控图像。

      任务：找出画面中远距离、可疑的行人目标。

      目标定义：
      - 高速公路上的行人：在路面、路肩、中央隔离带、匝道等道路区域行走或站立的普通人。
      - 包括滞留驾乘人员、穿越高速公路者、穿着反光背心的作业人员（但仅当未形成施工作业区时）。

      必须排除：
      - 骑乘姿态的人员：骑摩托车、电动车、自行车、三轮车的人,不得标为行人。
      - 车内人员：坐在轿车、SUV、货车、客车等四轮机动车内的人员。
      - 动物：四足行走的动物。
      - 非人物体：路侧标志牌、桥梁阴影、植被/树木、中央隔离带护栏反光片、路面反光点、施工设施等。

      输出 JSON：
      {
        "bbox_norm": [<x1, y1, x2, y2>] 或 null,
        "occluded": <true|false>,
        "confidence": <0.0-1.0>,
        "reason": "<选择理由>"
      }

      如果没有可疑目标：
      {
        "bbox_norm": null,
        "occluded": false,
        "confidence": 0.0,
        "reason": "<未发现理由>"
      }

      提示：
      - `bbox_norm` 取值范围 [0.0, 1.0]，x1 < x2，y1 < y2。
      - 目标应在道路区域（车道、应急车道、路肩、隔离带等）。
      - 不要把护栏、阴影、反光点、普通四轮车、前景固定遮挡物（金属杆、支架、摄像头外壳、立柱、雨刷、电线、标识牌杆）当作目标；不要仅因远处小目标轮廓与这些物体外形近似就泛化排除。

      遮挡与置信度：
      - 如果目标被电线杆、护栏、其他车辆遮挡导致只露出部分身体，设置 occluded=true 且 confidence≈0.1-0.3。
      - 如果能清晰看到完整人形轮廓和姿态，设置 occluded=false 且 confidence≈0.85-1.0。
      - 如果目标较远、细节模糊但疑似行人，设置 occluded=false 且 confidence≈0.45-0.70。
      - 只有 confidence ≥ 0.6 的候选才会被送入最终分类器；低于 0.6 的候选将被丢弃。

      示例（发现候选）：
      {"bbox_norm": [0.75, 0.10, 0.78, 0.15], "occluded": false, "confidence": 0.92, "reason": "画面右上角远处应急车道边缘有直立人形轮廓，位于道路区域，疑似行人"}
      {"bbox_norm": [0.48, 0.05, 0.52, 0.09], "occluded": false, "confidence": 0.55, "reason": "画面远处道路尽头有一个深色直立小轮廓，位于车道内，尺寸和形状均不同于车辆，可能是远距离行人"}

      示例（无候选）：
      {"bbox_norm": null, "occluded": false, "confidence": 0.0, "reason": "画面远处均为护栏与路面反光，未见位于道路区域的可疑人形目标"}
      {"bbox_norm": null, "occluded": false, "confidence": 0.0, "reason": "画面中的目标均为普通四轮机动车或骑乘姿态人员，没有直立行走/站立的行人"}

      重要：仅输出一个最可疑的远距离行人 bbox。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 5. Pedestrian Detection (event_id=3)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 5. Pedestrian Detection (event_id=3)
  # ---------------------------------------------------------------------------
  - template_id: "pedestrian_detection"
    name: "Pedestrian Detection"
    system_prompt: |
      你是一名专业的高速公路交通监控分析师。你的任务是判断合成图像红色方框内是否为高速公路上的行人。所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
    user_prompt: |
      输入为 1-2 张合成图像：
      - 第一张（如果有）：左侧为原视频帧，右侧红色方框区域为远距离可疑目标的放大图。
      - 第二张（如果有）：左侧为当前帧红色方框内区域的进一步放大图，右侧为相邻帧同一位置的放大图，用于观察目标是否移动及形态变化。

      任务：判断红色方框内是否为高速公路上的行人。

      定义 — 高速公路行人出现：
      高速公路是禁止行人进入的封闭交通区域。以下情况均属于高速公路行人出现事件：
      - **行人**：在高速公路车道、路肩、中央隔离带、匝道等**路面**上行走或站立的普通人
      - **穿越高速公路者**：试图横穿高速公路车道的人员
      - **滞留驾乘人员**：因车辆故障或事故滞留在道路上的人员
      - **施工人员/养护人员**：穿着反光背心、在道路区域作业的人员（是否应被后续裁决层排除，不是你现在该判断的）

      红色方框内必须同时满足：
      1. 是一个真实的人类（直立行走或站立的人形轮廓）；
      2. 位于高速公路路面/路肩/隔离带等道路区域（站在车上未落地则排除）；
      3. 不是骑乘姿态：不能坐在摩托车、电动车、自行车、三轮车上；
      4. 不是四轮机动车内的人员；
      5. 不是动物、标志牌、阴影、植被、护栏反光片等误报源。

      输出 JSON：
      {
        "detected": <true|false>,
        "is_target_explicitly_four_wheel_vehicle": <true|false>,
        "target_type": "<汽车|摩托车|电动车|非机动车|施工元素|行人|无法确定>",
        "instances": [
          {
            "start_time_sec": <大致开始时间（秒）>,
            "end_time_sec": <大致结束时间（秒）>,
            "evidence_frames": [<帧索引>],
            "description": "<观察到的内容：行人位置、行为、穿着、人数>",
            "reasoning": "<简要说明：人形特征确认、位置>"
          }
        ],
        "summary": "<总体评估：共发现多少行人，分布在什么位置，红框内目标是否为行人>"
      }

      `is_target_explicitly_four_wheel_vehicle` 填写规则（极其重要）：
      - 只回答“红色方框内的目标本身是否是四轮机动车（汽车/SUV/货车/面包车）”。
      - 如果红框内是行人、摩托车、电动车、非机动车、施工元素，必须填 false。
      - 如果只是背景中提到汽车、被汽车取代、与汽车对比、行人站在汽车旁边，必须填 false。
      - 只有当红框内目标本身明确是一辆汽车/SUV/货车/面包车/客车时，才填 true。

      如果红色方框内确实不是人类轮廓，或确实无法辨认，返回：
      {
        "detected": false,
        "is_target_explicitly_four_wheel_vehicle": false,
        "target_type": "无法确定",
        "instances": [],
        "summary": "红色方框内未确认到高速公路行人。"
      }

      示例（红框内是行人）：
      {"detected": true, "is_target_explicitly_four_wheel_vehicle": false, "target_type": "行人", "instances": [{"start_time_sec": 0, "end_time_sec": 0, "evidence_frames": [0], "description": "应急车道边缘站立行人", "reasoning": "红框内为直立人形轮廓，位于道路区域"}], "summary": "第0帧红框内有一名站立行人"}

      示例（红框内是汽车，应被 veto）：
      {"detected": false, "is_target_explicitly_four_wheel_vehicle": true, "target_type": "汽车", "instances": [], "summary": "红色方框内是一辆白色轿车，不是行人。"}

      专家阶段判断原则（非常重要）：
      - 你只做事实识别：红色方框内是不是一个位于道路区域的直立人形目标。
      - 只要红框内是位于道路区域的真实人类（含施工人员、养护人员、滞留人员），就应返回 detected=true。
      - 不要因"可能是合法施工""可能是事故滞留""穿着反光背心"等理由返回 detected=false；这些属于裁决层的排除逻辑，不是专家事实识别阶段该做的事。
      - 如果红框内是人形目标但因距离远、细节模糊而无法 100% 确认，只要位于道路区域且形态符合行人，应倾向判 detected=true，并把不确定性写在 reasoning 中。

      重要：
      - instances 中**只能**包含被红色方框标出的目标，不要报告红框外的其他行人。
      - 如果红框内不是行人，必须返回 detected=false。
    output_format_hint: "JSON"
    far_object_enhancement:
      enabled: true
      roi_template_id: "far_pedestrian_roi_detection"
      min_area_px: 60
      max_aspect_ratio: 2.5

