# =============================================================================
# event_id 1 — 应急车道占用检测（含远距离 ROI 辅助模板）
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # 3a. Far Emergency Lane ROI Detection (helper for event_id=1)
  # ---------------------------------------------------------------------------
  - template_id: "emergency_lane_roi_detection"
    name: "应急车道占用车辆 ROI 检测"
    system_prompt: |
      你是一名高速公路交通监控分析师。你的任务是在单帧高速公路监控图像中标定应急车道/导流区多边形，并标定其中占用车辆的 ROI。
      所有文本字段必须使用中文。
    user_prompt: |
      输入为单帧高速公路监控图像。

      任务：标定以下两类道路区域多边形，并在区域内标定占用车辆 ROI。

      区域定义：
      - emergency_lane（应急车道/路肩）：紧挨护栏或道路最边缘，通常以白色实线或路缘为界的紧急停车/通行区域。
      - chevron（导流区/鱼骨线/网状实线/分流鼻端区域）：匝道出入口、分流/汇流鼻端处由斜向或网状实线围成的导流线区域，车辆禁止驶入或停放。

      必须排除的区域：
      - 中央分隔带/中央隔离带/绿化带/护栏：道路正中间分隔对向车道的带状区域。双车道中央的绿化带、护栏、中央分隔带不属于应急车道，停在其附近的车辆不计入应急车道占用。
      - 对向车道：画面另一侧或隔离带对面、车流方向相反的车道。
      - 正常行车道：普通白色虚线/实线划分的车道，不含应急车道。

      位置提示：应急车道位于画面最左或最右侧（紧挨护栏/路肩），不要与画面中央/对向车道的隔离带混淆。

      输出 JSON：
      {
        "emergency_polygon_rel": [[x1,y1],[x2,y2],...] 或 null,
        "chevron_polygon_rel": [[x1,y1],[x2,y2],...] 或 null,
        "rois": [
          {
            "id": "V1",
            "label": "黄色工程车",
            "zone": "emergency_lane|chevron",
            "reason": "说明该车辆为何位于应急车道或导流区内",
            "rel_box": [x1,y1,x2,y2]
          }
        ],
        "summary": "..."
      }

      约束：
      - 所有坐标均为相对于画面宽高的 [0.0, 1.0] 归一化坐标。
      - 多边形按顺时针或逆时针顺序给出，首尾不必闭合。
      - 若画面中不存在某类区域，对应字段返回 null。
      - 只标定确实位于应急车道或导流区内的车辆；若车辆仅在正常行车道、中央分隔带或对向车道，不要标定。
      - 不要标定已驶离或仅短暂压线的车辆；优先标定明显停驻、行驶或停放于应急车道/导流区内的车辆。
      - `label` 示例：白色轿车、黑色SUV、黄色工程车、蓝色货车。

      未检测到 ROI 时：
      {
        "emergency_polygon_rel": null,
        "chevron_polygon_rel": null,
        "rois": [],
        "summary": "画面中未识别到应急车道或导流区内的占用车辆。"
      }

      仅输出 JSON，不要额外解释。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 3. Emergency Lane Occupancy Detection (event_id=1)
  # ---------------------------------------------------------------------------
  - template_id: "emergency_lane_occupancy_detection"
    name: "应急车道占用检测"
    system_prompt: |
      你是一名高速公路交通监控复核专家。你的任务是根据“车辆 ROI 合成图”对红框标注的车辆进行最终复核，判断其是否确实占用应急车道或导流区。所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
    user_prompt: |
      输入为 2 张合成图像：
      - 第一张 `03_vehicles_red_boxes.jpg`：原视频帧，叠加绘制了多个红色方框（bbox），每个方框为候选占用车辆，并标注了车辆简要描述与所在区域。
      - 第二张 `04_zoom_grid.jpg`：第一张中每个红框内区域的 4× 双三次插值放大图，按网格排列，用于观察远距离车辆的细节、车牌、车轮与区域边界关系。

      任务：判断红框车辆是否确实占用应急车道或导流区，排除中央分隔带、中央隔离带、绿化带、护栏、对向车道、正常行车道。双车道中央的绿化带、护栏、中央分隔带不属于应急车道，停在其附近的车辆不计入应急车道占用。

      定义 — 应急车道占用：
      任何车辆（行驶、停止、停放、部分进入）在应急车道（路肩）或导流区、鱼骨线区域内，即构成占用。
      匝道场景注意区分正常汇入汇出口与最边缘白色实线的应急车道。
      若白色实线连接着虚线，则说明该实线不是应急车道边缘，即使压线也不能认定为应急车道闯入。

      复核步骤：
      1. 在第一张图中确认应急车道/导流区位置（通常在画面最左或最右侧，紧挨护栏；导流区位于匝道鼻端）。
      2. 结合第二张放大图，检查每个红框车辆是否确实位于应急车道/导流区内，注意远距离目标和部分压线车辆。
      3. 发现占用车辆后，记录类型、颜色、位置与占用时间段。

      重要：
      - 应急车道占用判断要先确认区域归属，再判断车辆行为。
      - 车辆明确进入应急车道/路肩，或进入导流区、鱼骨线区域、网状实线区域、分流鼻端区域，需要报告 detected=true。
      - 即使只有一辆车部分进入应急车道/路肩或导流区/分流鼻端，也必须报告 detected=true。
      - 正常匝道、加速车道、减速车道、分流/汇流车道内的车辆不要判定为应急车道占用。
      - 中央分隔带、中央隔离带、绿化带、护栏、对向车道、正常行车道内的车辆必须排除。
      - 应急车道位于画面最左或最右侧（紧挨护栏/路肩），不要与画面中央/对向车道的隔离带、绿化带混淆。
      - 如果区域边界不清楚，不要仅凭"靠右/靠边/低速/停车"报告 detected=true，应结合车道线、导流线和通行路径判断。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <秒>,
            "end_time_sec": <秒>,
            "evidence_frames": [<整数帧号，例如 15, 16, 17>],
            "description": "<车辆类型、颜色、在应急车道上的位置>",
            "reasoning": "<车辆位置描述>"
          }
        ],
        "summary": "<总体评估>"
      }

      完整示例（仅供参考格式）：
      {
        "detected": true,
        "instances": [
          {
            "start_time_sec": 8,
            "end_time_sec": 14,
            "evidence_frames": [15, 16, 17],
            "description": "黑色SUV，占据最右侧应急车道",
            "reasoning": "车辆整体位于白色实线右侧的应急车道区域内，构成应急车道占用"
          }
        ],
        "summary": "视频中最右侧应急车道有一辆黑色SUV占用。"
      }

      未检测到时：{"detected": false, "instances": [], "summary": "未检测到应急车道占用。"}
    output_format_hint: "JSON"
    far_object_enhancement:
      enabled: true
      roi_template_id: "emergency_lane_roi_detection"
      frame_selection: "middle"
      enable_motion_filter: false
