# =============================================================================
# event_id 5 — 严重拥堵检测
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # 7. Congestion Detection (event_id=5)
  # ---------------------------------------------------------------------------
  - template_id: "heavy_congestion_detection"
    name: "拥堵检测"
    system_prompt: |
      你是一名交通监控分析师。你的任务是检测高速公路上的交通拥堵事件。所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
    user_prompt: |
      检测这些视频帧中是否存在交通拥堵。

      定义 — 交通拥堵：
      交通拥堵是指高速公路上出现单车道或多车道通行能力下降、影响道路整体通行效率的交通状态。与正常车流密集不同，拥堵具有以下特征：
      - 车辆平均速度相比正常高速公路通行速度降低
      - 车辆密度高，车间距变小
      - 出现走走停停（stop-and-go）交通模式或车辆排队
      - 单/多车道车辆排队或通行缓慢
      - 出入匝道口拥堵也属于交通拥堵

      视觉特征（综合判断）：
      - 车辆密度高，车间距小
      - 走走停停模式：部分帧中车辆静止，部分帧中缓慢移动
      - 车辆队列向画面远处延伸
      - 多/单车道出现缓慢通行

      重要 — 区分规则（必须严格遵守）：
      1. **拥堵的核心判断标准**：单车道或多车道通行能力下降。无需强阈值，看到车速下降、车间距变小、排队或走走停停即可判定。
      2. **正常车流密集 ≠ 拥堵**：车辆多但仍在正常速度行驶、车间距正常、无排队，不判定为拥堵。
      3. **单车道缓慢 = 拥堵**：仅单车道车辆缓慢而其他车道通行正常，也判定为拥堵。
      4. **事故导致的拥堵**：若同时看到事故，拥堵作为事故的伴随现象由裁决层归并；专家阶段仍报告拥堵事实。

      检查步骤：
      1. 观察所有车道的车辆运动状态。
      2. 对比早帧和晚帧中同一车辆的位置变化，判断车辆是否停滞或低速。
      3. 观察车辆队列长度和多车道状态。
      4. 综合判断是否为拥堵，**单个车道拥堵也属于拥堵事件**。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <float>,
            "end_time_sec": <float>,
            "evidence_frames": [<int>],
            "description": "<中文描述：拥堵位置、涉及车道、排队长度、车辆状态等>",
            "reasoning": "<简要说明：车速观察结果、排队长度、涉及车道、是否排除事故导致的拥堵>"
          }
        ],
        "summary": "<中文总体评估：是否检测到拥堵，拥堵程度描述，涉及范围>"
      }

      如果未检测到交通拥堵，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到交通拥堵。"
      }

    output_format_hint: "JSON"

