# =============================================================================
# event_id 1 — 违法停车检测
# 作用:含 template_id=illegal_parking_detection 的违法停车事件检测模板。
# 影响:统一由 core/config_manager.py 的 _load_prompt_templates 按 prompts/*.yaml
#      glob 加载;illegal_parking_detection 由 core/expert_agent.py 按事件类别的
#      prompt_template_id 调用执行检测。
# =============================================================================

prompt_templates:




  # ---------------------------------------------------------------------------
  # 2. Illegal Parking Detection (event_id=1)
  # Purpose: Detect vehicles that have come to a complete stop on the roadway.
  # ---------------------------------------------------------------------------
  - template_id: "illegal_parking_detection"
    name: "Illegal Parking Detection"
    system_prompt: |
      你是一名高速公路交通监控分析师，专门检测违法停车事件。输出必须是合法 JSON，不含其他文本。所有文本字段必须使用中文。
    user_prompt: |
      检测这些视频帧中的违法停车事件。

      定义 — 违法停车：
      机动车在道路上持续静止的交通事件。
      - 事件发生区域包括：行车道（主车道）、应急车道、导流区、路肩
      - 只要车辆在上述区域静止停放，即构成违法停车

      排除项（必须遵守）：
      - 摩托车、电动车、自行车、三轮车等非机动车静止时，不判定为违法停车。
      - 已判定为交通事故的场景中，静止车辆属于事故，不重复判定为违法停车。

      检查步骤：
        1. 逐帧观察视频，扫描所有道路上的车辆。
        2. 判断每辆车是否静止。通过对比多帧中车辆相对于路面标线、护栏等固定参照物的位置变化来判断。
        3. 对静止车辆，记录：
           - 车辆类型、颜色
           - 所在区域（行车道/应急车道/导流区/路肩）
           - 静止持续时间（如可判断）
        4. 以下情况仍需报告违停：
           - 施工区域内的静止车辆
           - 应急车道上的静止车辆

      返回 JSON:
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <秒>,
            "end_time_sec": <秒>,
            "evidence_frames": [<整数帧号，例如 15, 16, 17>],
            "description": "<区域+颜色+车型+静止状态>",
            "reasoning": "发现<车辆特征>，位于<区域>，相对于<固定参照物>位置未发生变化 → 判定为静止 → 违法停车"
          }
        ],
        "summary": "<总体评估>"
      }

      完整示例（仅供参考格式）：
      {
        "detected": true,
        "instances": [
          {
            "start_time_sec": 12,
            "end_time_sec": 20,
            "evidence_frames": [15, 16, 17],
            "description": "应急车道，白色小型客车，持续静止",
            "reasoning": "发现白色小型客车位于应急车道，相对于护栏位置未发生变化 → 判定为静止 → 违法停车"
          }
        ],
        "summary": "视频中应急车道存在一辆违法停车的白色小型客车。"
      }

      重要：
      - "evidence_frames" 必须是整数帧号列表（如 [15, 16, 17]），不能是时间戳或时间字符串。
      - 如果视频画面右上角/左上角有时间戳字符串（如 "15:52:20"），不要把它写进 "evidence_frames"。

      未检测到时：{"detected": false, "instances": [], "summary": "未检测到违法停车。"}
    output_format_hint: "JSON"

