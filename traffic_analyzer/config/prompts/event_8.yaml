# =============================================================================
# event_id 10 — 抛洒物检测
# 作用:含 template_id=thrown_object_detection 的抛洒物事件检测模板。
# 影响:统一由 core/config_manager.py 的 _load_prompt_templates 按 prompts/*.yaml
#      glob 加载;thrown_object_detection 由 core/expert_agent.py 按事件类别的
#      prompt_template_id 调用执行检测。
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # 10. Thrown Object Detection (event_id=10)
  # ---------------------------------------------------------------------------
  - template_id: "thrown_object_detection"
    name: "抛洒物检测"
    system_prompt: |
      你是一名交通监控分析师。你的任务是检测车道内可能影响车辆正常通行的抛洒物。所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
    user_prompt: |
      检测这些视频帧中的抛洒物（遗落至车道内的异物）。

      定义 — 抛洒物：
      抛洒物是指遗落、掉落或抛洒至高速公路车道内，可能对车辆正常通行造成干扰或安全隐患的物体。抛洒物可以是静止在路面上的，也可以是正在空中飘落的。

      抛洒物包括但不限于：
      - 塑料袋、编织袋、纸张、布料等轻质物品
      - 瓶子、罐子、包装盒等容器类物品
      - 木板、金属片、轮胎碎片等硬质物品
      - 泥土、砂石、建筑材料等散状物品
      - 衣物、被褥、绳索等其他杂物
      - 任何不属于道路正常组成部分的异物

      视觉特征：
      - 车道内出现与路面颜色/纹理明显不同的异物
      - 车道内有反光、飘动、滚动或静止的异常物体
      - 空中飘落的物品（塑料袋、纸张等）
      - 车辆附近突然出现的飞溅物或掉落物

      重要 — 包含规则（以下情况按抛洒物处理）：
      1. **三角警示牌等标识牌的异常状态**：三角牌、警示牌等在无提醒作用时按抛洒物处理。例如：倒在地上、不在事故车辆后方正常放置、被风吹倒等。
      2. **施工物品散落至施工区域外**：施工时的物品（如锥桶、施工标志牌、工具等）如果散落到施工区域以外的车道内，按抛洒物处理。
      3. **小动物/牲畜**：进入车道内的动物按抛洒物处理。

      检查步骤：
      1. 扫描各车道路面区域（包括中央、分界线附近、远处、边缘、车辆前后），寻找与路面颜色/纹理不一致的异物。
      2. 帧间对比：观察物体是否位置变化、突然出现或消失。
      3. 注意小目标（可能只有10x10像素），关注颜色/纹理/形状/运动异常。
      4. 排除正常设施（路面标线、井盖、排水口等）。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <float>,
            "end_time_sec": <float>,
            "evidence_frames": [<int>],
            "description": "<中文描述：抛洒物类型、颜色、大小、所在车道位置、状态（静止/滚动/飘落等）>",
            "reasoning": "<简要说明：发现位置、与路面差异特征、帧间变化>"
          }
        ],
        "summary": "<中文总体评估：是否检测到抛洒物，涉及数量和类型，对交通的潜在影响>"
      }

      如果未检测到抛洒物，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到抛洒物。"
      }

      重要：
      - 即使只有很小的可疑物体，也要报告 detected=true。
      - 抛洒物通常很小，在720p缩放下可能只有10x10像素，需要特别注意。
    output_format_hint: "JSON"

