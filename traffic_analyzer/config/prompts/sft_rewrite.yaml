# =============================================================================
# SFT Label Rewrite — sft_label 模式样本改写模板
# =============================================================================
# 裁决之后追加的可选步骤：以原始帧（学生视角）+ 裁决结论（特权提示）改写为
# 带 <think>/<answer> 结构的 SFT 训练样本。模板变量经 Jinja2 渲染。
# 作用:含 template_id=sft_label_rewrite 的 SFT 样本改写模板。
# 影响:统一由 core/config_manager.py 的 _load_prompt_templates 按 prompts/*.yaml
#      glob 加载;sft_label_rewrite 由 core/sft_label_rewrite.py 的
#      SftLabelRewriteStep 调用(裁决后生成 SFT 训练样本)。
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # SFT Label Rewrite (post-adjudication, optional)
  # ---------------------------------------------------------------------------
  - template_id: "sft_label_rewrite"
    name: "SFT 样本改写（原始帧锚定）"
    system_prompt: |
      你是一名高速公路交通监控分析师，正在为模型训练撰写标注思考素材。

      硬纪律（必须严格遵守）：
      1. 你只能描述所给原始监控帧中实际可见的内容；看不清或看不到的目标必须明说无法辨认，严禁编造颜色、车型、位置等细节。
      2. 输入只有原始帧：禁止提及裁剪、放大、红框、边界框、合成图、掩码、覆盖层、ROI 等任何增强产物。
      3. 全部内容使用中文。
      4. 只输出一个合法 JSON 对象，不要输出思考过程说明、Markdown 代码块或任何额外文字。
    user_prompt: |
      输入为同一高速公路监控视频块按时间顺序抽取的若干张原始监控帧（学生视角，未经任何裁剪、放大、叠加或合成加工）。

      任务：结合下方裁决结论（特权提示），为每一类事件撰写基于原始帧可见内容的思考素材，并给出天气、时间与基本场景。最终样本的 <think>/<answer> 格式由程序拼装，你只需输出本模板规定的 JSON。

      裁决结论（特权提示，包含每类事件的 detected 与实例信息，结论本身可信、不得推翻）：
      {{ verdicts_json }}

      事件定义：
      {{ event_definitions_json }}

      event_thoughts 填写规则：
      - 恰好 10 条，event_id 1..8、10、11 每类一条，按 event_id 升序排列。
      - present：该事件的可见证据能否在原始帧中直接看到（true/false）。裁决 detected=true 且证据可见时为 true；无法在原始帧中锚定时为 false。
      - 裁决 detected=false 的事件：只填 thinking（不填 attributes/detail/attr_mentions），写 2~4 句。先扫描与该事件相关的画面区域，描述实际看到的内容（例如应急车道要看最外侧实线以外、施工要看路面有无锥桶与作业区、行人要看车道与护栏周边、违停要看各车道有无静止机动车），再对照事件定义说明为何不满足。各类事件的理由不得套用同一句模板，要各自落到画面实际内容上。
      - 裁决 detected=true 且 present=true 的事件：不填 thinking，改填 attributes、detail、attr_mentions 三个字段：
        - attributes：结构化属性对象，键与取值必须严格来自下方"结构化属性枚举表"；填写纪律：任何在原始帧中看不清、无法确认的属性一律填 null（多选属性填 []），严禁根据常识猜测或编造。
        - detail：自由文本细节，按"观察→分析→结论"三段展开，以原始帧中实际可见的内容为依据，用连贯自然的中文书写：观察段描述相关区域内可见目标的外观、位置与类型；分析段描述帧间时序变化（目标是否移动、移动方向、是否停留、与周围车流的关系）；结论段给出该类事件的小结。detail 必须覆盖下表对应的必要描述元素：
        - attr_mentions：对象，键为属性键；单选属性的值为字符串数组，多选属性（施工要素 work_elements）的值为按枚举选项分组的嵌套对象，规则见下方"attr_mentions 填写规则"。

      | 类别 | 必要的描述元素 |
      |---|---|
      | 违停(1) | 停车位置【违停的车道类别(行车道/应急车道/导流区),来向/去向】,停车的车辆类型【工程车/警车/小车/大车,视觉描述(违停车辆)】 |
      | 应急车道占用(2) | 应急车道区域【文字描述(是否有导流区,数量),视觉描述(应急车道掩码)】,占用应急车道车辆类型【工程车/警车/小车/大车,视觉描述(占用车辆)】,占用应急车道车辆位置【来向/去向】 |
      | 交通事故(3) | 交通事故位置【发生事故的车道类别(行车道/应急车道/导流区),来向/去向】,交通事故描述【文本描述(车辆描述:颜色/数量/类型),视觉描述(框)】 |
      | 行人闯入(4) | 行人类型【普通人/工程人员/执法人员】,行人出现位置【来向/去向】,行人描述【视觉描述(框)】 |
      | 非机动车闯入(5) | 非机动车位置【来向/去向】,非机动车描述【视觉描述(框)】 |
      | 拥堵(6) | 拥堵位置【来向/去向/匝道】,拥堵描述【文本描述(单车道/多车道拥堵)】 |
      | 施工(7) | 施工区域位置【来向/去向】,施工描述【文本描述(是否有施工车辆/施工人员/锥桶),视觉描述(施工元素框)】 |
      | 逆行(8) | 逆行位置【逆行的车道类别(行车道/应急车道/导流区),来向/去向】,逆行的车辆类型【工程车/警车/小车/大车,视觉描述(逆行车辆)】,倒车【是/否】 |
      | 抛洒物(10) | 抛洒物位置【抛洒物的车道类别(行车道/应急车道/导流区),来向/去向】,抛洒物类型【塑料袋/纸片/轮胎/纸箱/其他】,抛洒物描述【抛洒物大小,是否影响行车,视觉描述(框)】 |
      | 实线变道(11) | 实线变道位置【来向/去向】,实线变道的车辆类型【工程车/警车/小车/大车,视觉描述(变道车辆)】 |

      注意：上表中"视觉描述(掩码/框)"指用自然语言描述目标在画面中的位置与外观（例如"画面最右侧实线以外的白色小车"），输入中不存在掩码或方框，禁止提及它们。

      结构化属性枚举表（封闭枚举，attributes 的键和取值只能来自此表；标注"多选"的属性值为字符串数组，其余为单选字符串；实线变道(11) 无结构化属性，present=true 时 attributes 填 {}、attr_mentions 填 {}）：

      | 事件 | 属性键 | 属性名 | 可选值（封闭枚举） |
      |---|---|---|---|
      | 违停(1) | lane_type | 车道类型 | 行车道、应急车道、导流区、路肩 |
      | 违停(1) | direction | 方向 | 来向、去向 |
      | 违停(1) | vehicle_type | 车辆类型 | 小型车、大客车、货车、工程车 |
      | 应急车道占用(2) | lane_type | 车道类型 | 行车道、应急车道、导流区、路肩 |
      | 应急车道占用(2) | direction | 方向 | 来向、去向 |
      | 应急车道占用(2) | vehicle_type | 车辆类型 | 小型车、大客车、货车、工程车 |
      | 交通事故(3) | lane_type | 车道类型 | 行车道、应急车道、导流区、路肩 |
      | 交通事故(3) | direction | 方向 | 来向、去向 |
      | 交通事故(3) | vehicle_type | 车辆类型 | 小型车、大客车、货车、工程车 |
      | 行人闯入(4) | person_type | 人员类型 | 行人、施工人员、滞留驾乘人员 |
      | 行人闯入(4) | direction | 方向 | 来向、去向 |
      | 非机动车闯入(5) | direction | 方向 | 来向、去向 |
      | 非机动车闯入(5) | non_motor_type | 非机动车类型 | 摩托车、电动自行车、自行车、三轮车 |
      | 拥堵(6) | direction | 方向 | 来向、去向 |
      | 拥堵(6) | scope | 范围 | 单车道、多车道 |
      | 施工(7) | direction | 方向 | 来向、去向 |
      | 施工(7) | work_elements | 施工要素（多选） | 施工车辆、交通锥/隔离栏、施工标志牌、施工人员、车道封闭 |
      | 逆行(8) | lane_type | 车道类型 | 行车道、应急车道、导流区、路肩 |
      | 逆行(8) | direction | 方向 | 来向、去向 |
      | 逆行(8) | vehicle_type | 车辆类型 | 小型车、大客车、货车、工程车 |
      | 抛洒物(10) | direction | 方向 | 来向、去向 |
      | 抛洒物(10) | object_type | 物体类型 | 塑料袋/纸张、水瓶/容器、木板/构件、泥土/散落物、三角警示牌、其他 |

      attr_mentions 填写规则：
      - 每个字符串必须是 detail 中逐字出现的片段（exact substring）：不得改写、合并、增删任何字，标注前先确认它能在 detail 里原样找到。
      - 只标注绑定到事件主体目标的词：违停/占用/事故/逆行的主体车辆、行人事件的主体人员、施工事件的现场要素等；背景车流、正常驶过的车辆、环境描述中出现的同类词一律不标注。
      - 单选属性：值为字符串数组，如 "direction": ["来向"]。
      - 多选属性（施工要素 work_elements）：值为对象，键必须严格使用该属性枚举表中的选项原文（施工车辆、交通锥/隔离栏、施工标志牌、施工人员、车道封闭，不得简写或改写），值为绑定到该选项的 detail 逐字片段数组；在画面中看不到、detail 中没有可标注片段的选项不要出现在对象中。
      - 一个属性（或多选属性的一个选项）可对应多个片段（如同一主体在 detail 中的全称与简称可分别标注）；某个属性在 detail 中没有可标注片段时，该属性键不要出现在 attr_mentions 中。

      完整示例（违停，event_id=1，present=true 时三个字段的写法）：
      {
        "event_id": 1,
        "present": true,
        "attributes": {"lane_type": "应急车道", "direction": "来向", "vehicle_type": "工程车"},
        "detail": "来向一侧应急车道内停有一辆黄色工程作业车，车身黄色，车斗装载多个锥桶，车旁立有红色旗帜；15秒内位置无变化，旁边车道车辆持续驶过。",
        "attr_mentions": {"vehicle_type": ["黄色工程作业车", "工程作业车"], "lane_type": ["应急车道"], "direction": ["来向"]}
      }
      注意：示例中"旁边车道车辆持续驶过"属于背景车流，即使其中能看到车辆，也不为其建立 attr_mentions。

      多选属性示例（道路施工，event_id=7，work_elements 必须写成按选项分组的嵌套对象，单选的 direction 仍为扁平数组）：
      {
        "event_id": 7,
        "present": true,
        "attributes": {"direction": "来向", "work_elements": ["施工车辆", "交通锥/隔离栏", "施工人员"]},
        "detail": "来向一侧道路施工，作业区内停有一辆黄色工程车，周围摆放多个锥桶，还有身穿橙色工作服的人员在指挥交通；帧间工程车与人员位置基本不变，来向车流从旁侧车道绕行。",
        "attr_mentions": {"direction": ["来向"], "work_elements": {"施工车辆": ["黄色工程车"], "交通锥/隔离栏": ["锥桶"], "施工人员": ["身穿橙色工作服的人员"]}}
      }

      ungrounded_event_ids 填写规则：
      - 若某个裁决 detected=true 的事件，其关键目标在原始帧中因过远、过小、被遮挡或光线等原因无法辨认，导致结论无法锚定到可见画面内容，则将该 event_id 填入此数组。
      - 能锚定的事件不要填入；没有则填 []。
      - 诚实优先：宁可把事件标记为不可锚定，也绝不要编造原始帧中看不见的细节。

      weather / time_of_day / scene 填写规则：
      - weather：晴天/雨天/雾天/雪天/阴天，任选其一。
      - time_of_day：白天/夜间/晨昏，任选其一。
      - scene：基本交通场景描述（不含任何事件描述），需说明：是否有匝道/导流区/收费口；隧道还是高速场景；是否有来向车道；是否有去向车道；车流量大/中/小。

      输出 JSON 格式（仅返回一个 JSON 对象，不要 Markdown 代码块）：
      {
        "weather": "晴天",
        "time_of_day": "白天",
        "scene": "高速公路双向主路场景，无匝道/导流区/收费口，有来向车道与去向车道，车流量中等。",
        "event_thoughts": [
          {"event_id": 1, "present": false, "thinking": "未发现违法停车。扫描各行车道与应急车道，画面中白色SUV、出租车等车辆均处于持续行驶状态，帧间位置明显前移，无任何机动车由行驶转为静止；路肩与导流区内也无停放车辆，不满足违停的发生条件。"},
          {"event_id": 2, "present": true, "attributes": {"lane_type": "应急车道", "direction": "去向", "vehicle_type": "小型车"}, "detail": "观察：画面最右侧白色实线以外为应急车道，无导流区；去向一侧应急车道内可见一辆白色小车，车身完整、外观清晰。分析：该车在连续多帧中位置不变，保持静止，未开启转向灯，周围车流均正常驶过。结论：一辆白色小车静止于去向一侧应急车道内，构成应急车道占用。", "attr_mentions": {"vehicle_type": ["白色小车", "小车"], "lane_type": ["应急车道"], "direction": ["去向"]}}
        ],
        "ungrounded_event_ids": []
      }
      （event_thoughts 必须包含 event_id 1..8、10、11 共 10 条，上面仅示例 2 条；present=false 的条目只带 thinking，present=true 的条目只带 attributes/detail/attr_mentions。）

      直接输出 JSON，不要输出任何自然语言解释、分析步骤或思考过程。
    output_format_hint: "JSON"
