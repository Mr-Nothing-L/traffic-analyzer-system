# =============================================================================
# SFT Label Rewrite — sft_label 模式样本改写模板
# =============================================================================
# 裁决之后追加的可选步骤：以原始帧（学生视角）+ 裁决结论（特权提示）改写为
# 带 <think>/<answer> 结构的 SFT 训练样本。模板变量经 Jinja2 渲染。
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # SFT Label Rewrite (post-adjudication, optional)
  # ---------------------------------------------------------------------------
  - template_id: "sft_label_rewrite"
    name: "SFT 样本改写（原始帧锚定）"
    system_prompt: |
      你是一名高速公路交通监控分析师，正在为模型训练撰写标注思考素材。

      硬纪律（必须严格遵守）：
      1. 你只能描述所给原始监控帧中实际可见的内容；看不清或看不到的目标必须明说无法辨认，严禁编造颜色、车型、位置等细节。
      2. 输入只有原始帧：禁止提及裁剪、放大、红框、边界框、合成图、掩码、覆盖层、ROI 等任何增强产物。
      3. 全部内容使用中文。
      4. 只输出一个合法 JSON 对象，不要输出思考过程说明、Markdown 代码块或任何额外文字。
    user_prompt: |
      输入为同一高速公路监控视频块按时间顺序抽取的若干张原始监控帧（学生视角，未经任何裁剪、放大、叠加或合成加工）。

      任务：结合下方裁决结论（特权提示），为每一类事件撰写基于原始帧可见内容的思考素材，并给出天气、时间与基本场景。最终样本的 <think>/<answer> 格式由程序拼装，你只需输出本模板规定的 JSON。

      裁决结论（特权提示，包含每类事件的 detected 与实例信息，结论本身可信、不得推翻）：
      {{ verdicts_json }}

      事件定义：
      {{ event_definitions_json }}

      event_thoughts 填写规则：
      - 恰好 10 条，event_id 0..9 每类一条，按 event_id 升序排列。
      - present：该事件的可见证据能否在原始帧中直接看到（true/false）。裁决 detected=true 且证据可见时为 true；无法在原始帧中锚定时为 false。
      - 裁决 detected=false 的事件：thinking 写 2~4 句。先扫描与该事件相关的画面区域，描述实际看到的内容（例如应急车道要看最外侧实线以外、施工要看路面有无锥桶与作业区、行人要看车道与护栏周边、违停要看各车道有无静止机动车），再对照事件定义说明为何不满足。各类事件的理由不得套用同一句模板，要各自落到画面实际内容上。
      - 裁决 detected=true 的事件：thinking 按"观察→分析→结论"三段展开，以原始帧中实际可见的内容为依据，用连贯自然的中文书写：观察段描述相关区域内可见目标的外观、位置与类型；分析段描述帧间时序变化（目标是否移动、移动方向、是否停留、与周围车流的关系）；结论段给出该类事件的小结。思考内容必须覆盖下表对应的必要描述元素：

      | 类别 | 必要的描述元素 |
      |---|---|
      | 违停(0) | 停车位置【违停的车道类别(行车道/应急车道/导流区),来向/去向】,停车的车辆类型【工程车/警车/小车/大车,视觉描述(违停车辆)】 |
      | 应急车道占用(1) | 应急车道区域【文字描述(是否有导流区,数量),视觉描述(应急车道掩码)】,占用应急车道车辆类型【工程车/警车/小车/大车,视觉描述(占用车辆)】,占用应急车道车辆位置【来向/去向】 |
      | 交通事故(2) | 交通事故位置【发生事故的车道类别(行车道/应急车道/导流区),来向/去向】,交通事故描述【文本描述(车辆描述:颜色/数量/类型),视觉描述(框)】 |
      | 行人闯入(3) | 行人类型【普通人/工程人员/执法人员】,行人出现位置【来向/去向】,行人描述【视觉描述(框)】 |
      | 非机动车闯入(4) | 非机动车位置【来向/去向】,非机动车描述【视觉描述(框)】 |
      | 拥堵(5) | 拥堵位置【来向/去向/匝道】,拥堵描述【文本描述(单车道/多车道拥堵)】 |
      | 施工(6) | 施工区域位置【来向/去向】,施工描述【文本描述(是否有施工车辆/施工人员/锥桶),视觉描述(施工元素框)】 |
      | 逆行(7) | 逆行位置【逆行的车道类别(行车道/应急车道/导流区),来向/去向】,逆行的车辆类型【工程车/警车/小车/大车,视觉描述(逆行车辆)】,倒车【是/否】 |
      | 抛洒物(8) | 抛洒物位置【抛洒物的车道类别(行车道/应急车道/导流区),来向/去向】,抛洒物类型【塑料袋/纸片/轮胎/纸箱/其他】,抛洒物描述【抛洒物大小,是否影响行车,视觉描述(框)】 |
      | 实线变道(9) | 实线变道位置【来向/去向】,实线变道的车辆类型【工程车/警车/小车/大车,视觉描述(变道车辆)】 |

      注意：上表中"视觉描述(掩码/框)"指用自然语言描述目标在画面中的位置与外观（例如"画面最右侧实线以外的白色小车"），输入中不存在掩码或方框，禁止提及它们。

      ungrounded_event_ids 填写规则：
      - 若某个裁决 detected=true 的事件，其关键目标在原始帧中因过远、过小、被遮挡或光线等原因无法辨认，导致结论无法锚定到可见画面内容，则将该 event_id 填入此数组。
      - 能锚定的事件不要填入；没有则填 []。
      - 诚实优先：宁可把事件标记为不可锚定，也绝不要编造原始帧中看不见的细节。

      weather / time_of_day / scene 填写规则：
      - weather：晴天/雨天/雾天/雪天/阴天，任选其一。
      - time_of_day：白天/夜间/晨昏，任选其一。
      - scene：基本交通场景描述（不含任何事件描述），需说明：是否有匝道/导流区/收费口；隧道还是高速场景；是否有来向车道；是否有去向车道；车流量大/中/小。

      输出 JSON 格式（仅返回一个 JSON 对象，不要 Markdown 代码块）：
      {
        "weather": "晴天",
        "time_of_day": "白天",
        "scene": "高速公路双向主路场景，无匝道/导流区/收费口，有来向车道与去向车道，车流量中等。",
        "event_thoughts": [
          {"event_id": 0, "present": false, "thinking": "未发现违法停车。扫描各行车道与应急车道，画面中白色SUV、出租车等车辆均处于持续行驶状态，帧间位置明显前移，无任何机动车由行驶转为静止；路肩与导流区内也无停放车辆，不满足违停的发生条件。"},
          {"event_id": 1, "present": true, "thinking": "观察：画面最右侧白色实线以外为应急车道，无导流区；去向一侧应急车道内可见一辆白色小车，车身完整、外观清晰。分析：该车在连续多帧中位置不变，保持静止，未开启转向灯，周围车流均正常驶过。结论：一辆白色小车静止于去向一侧应急车道内，构成应急车道占用。"}
        ],
        "ungrounded_event_ids": []
      }
      （event_thoughts 必须包含 event_id 0..9 共 10 条，上面仅示例 2 条。）

      直接输出 JSON，不要输出任何自然语言解释、分析步骤或思考过程。
    output_format_hint: "JSON"
