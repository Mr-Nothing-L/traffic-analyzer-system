# =============================================================================
# event_id 4 — 摩托车出现检测（含远距离 ROI 辅助模板）
# =============================================================================

prompt_templates:

  # ---------------------------------------------------------------------------
  # 5b. Far Motorcycle ROI Detection (helper for event_id=4)
  # ---------------------------------------------------------------------------
  - template_id: "far_non_motor_roi_detection"
    name: "远距离摩托车批量 ROI 检测"
    system_prompt: |
      你是一名高速公路交通监控分析师。你的任务是检测单帧图像中远距离可疑的两轮/三轮摩托车，并输出归一化 bbox。
      所有文本字段必须使用中文。
    user_prompt: |
      输入为单帧高速公路监控图像。

      任务：找出画面中远距离、可疑的摩托车目标（两轮/三轮摩托车）。

      输出 JSON：
      {
        "bbox_norm": [<x1, y1, x2, y2>] 或 null,
        "occluded": <true|false>,
        "confidence": <0.0-1.0>,
        "reason": "<选择理由>"
      }

      如果没有可疑目标：
      {
        "bbox_norm": null,
        "occluded": false,
        "confidence": 0.0,
        "reason": "<未发现理由>"
      }

      提示：
      - `bbox_norm` 取值范围 [0.0, 1.0]，x1 < x2，y1 < y2。
      - 目标应在道路区域（车道、应急车道、路肩等）。
      - 不要把护栏、阴影、反光点、普通四轮车、前景固定遮挡物（金属杆、支架、摄像头外壳、立柱、雨刷、电线、标识牌杆）当作目标；不要仅因远处小目标轮廓与这些物体外形近似就泛化排除。

      遮挡与置信度：
      - 如果目标被电线杆、护栏、其他车辆遮挡导致只露出部分车身，或看起来是四轮车残部，必须设置 occluded=true 且 confidence≈0.1-0.3。
      - 如果能清晰看到完整两轮/三轮轮廓和骑乘姿态，设置 occluded=false 且 confidence≈0.85-1.0。
      - 如果目标较远、细节模糊但疑似摩托车，设置 occluded=false 且 confidence≈0.45-0.70。
      - 注意：只有 confidence ≥ 0.6 的候选才会进入最终分类器；低于 0.6 的候选将被过滤。请不要为了保留候选而人为抬高置信度。

      示例（发现候选）：
      {"bbox_norm": [0.75, 0.10, 0.78, 0.15], "occluded": false, "confidence": 0.92, "reason": "画面右上角远处应急车道边缘有黑色狭长轮廓，疑似骑乘姿态，位于道路区域"}
      {"bbox_norm": [0.48, 0.05, 0.52, 0.09], "occluded": false, "confidence": 0.55, "reason": "画面远处道路尽头有一个深色小轮廓，位于车道内，尺寸和形状均不同于四轮车，可能是远距离摩托车"}

      示例（无候选）：
      {"bbox_norm": null, "occluded": false, "confidence": 0.0, "reason": "画面远处均为护栏与路面反光，未见位于道路区域的可疑摩托车目标"}
      {"bbox_norm": null, "occluded": false, "confidence": 0.0, "reason": "画面中的车辆均为普通四轮机动车，没有明显小于四轮车的可疑目标"}

      重要：仅输出一个最可疑的远距离摩托车 bbox。
    output_format_hint: "JSON"

  # ---------------------------------------------------------------------------
  # 5c. Road Construction Multi-evidence ROI Detection (helper for event_id=6)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 6. Motorcycle Detection (event_id=4)
  # ---------------------------------------------------------------------------
  - template_id: "non_motor_vehicle_detection"
    name: "Motorcycle Detection"
    system_prompt: |
      你是一名专业的高速公路交通监控分析师。你的任务是判断合成图像红色方框内是否为两轮/三轮摩托车。
      所有文本字段必须使用中文。
    user_prompt: |
      输入为 1-2 张合成图像：
      - 第一张（如果有）：左侧为原视频帧，右侧红色方框区域为远距离可疑目标的放大图。
      - 第二张（如果有）：左侧为当前帧红色方框内区域的进一步放大图，右侧为相邻帧同一位置的放大图，用于观察目标是否移动及形态变化。

      运动对比图的使用方法（极其重要）：
      - 摩托车是运动的，因此在相邻帧同一位置可能看不到同一个目标（它已离开该 ROI 区域），这是正常的运动证据。
      - 如果当前帧红框内只是无结构的暗斑、黑影、反光点，且相邻帧同一位置仍然存在同样的暗斑/黑影/反光点，说明它是路面污渍、阴影、固定遮挡物或噪声，必须判 detected=false。
      - 如果当前帧能看到细长两轮/三轮轮廓、车轮、车把、骑乘者等人车结构证据，而相邻帧同一位置没有该目标（说明它在运动），则支持判为摩托车。
      - 注意：如果相邻帧中该目标只是被其他车辆明显遮挡，需结合当前帧结构证据综合判断，不能仅因相邻帧看不到就排除。

      任务：判断红色方框内是否为高速公路上的两轮/三轮摩托车。

      输出 JSON：
      {
        "detected": <true|false>,
        "is_target_explicitly_four_wheel_vehicle": <true|false>,
        "target_type": "<汽车|摩托车|电动车|非机动车|施工元素|行人|无法确定>",
        "reason": "<判断理由>"
      }

      `is_target_explicitly_four_wheel_vehicle` 填写规则（极其重要）：
      - 只回答“红色方框内的目标本身是否是四轮机动车（汽车/SUV/货车/面包车）”。
      - 如果红框内是摩托车、电动车、自行车、三轮车、行人、施工元素，必须填 false。
      - 如果只是背景中提到汽车、被汽车取代、被汽车遮挡、与汽车对比（例如“是摩托车而非汽车”），必须填 false。
      - 只有当红框内目标本身明确是一辆汽车/SUV/货车/面包车/客车/工程车辆时，才填 true。

      判定为摩托车必须同时满足：
      1. 红色方框内是两轮或三轮摩托车；
      2. 放大后能看到至少一项明确的车辆结构证据，例如：两个圆形车轮、车把、车座、车架、骑乘者的人影/上半身轮廓/头盔、车灯、尾灯、车牌等；
      3. 目标高度明显大于宽度（宽高比 < 1:1），呈细长轮廓；
      4. 仅凭宽高比或尺寸符合不能判定为摩托车，必须有可辨识的结构证据。

      以下情况必须排除（detected=false）：
      - 电动自行车、自行车、三轮车（这些不是摩托车）
      - 汽车、SUV、货车、客车、面包车等四轮机动车
      - 工程车辆、压路机、沥青摊铺机、挖掘机、起重机、清扫车、水泥搅拌车等异形车辆
      - 施工区域内的车辆或人员（周围有交通锥、隔离栏、施工标志牌、工程车辆、反光背心人员）
      - 护栏边缘穿反光背心的施工人员或养护人员
      - 静态物体与前景固定遮挡物：路面反光点、阴影、污渍、交通标志牌、井盖、监控摄像头、支架、立柱、雨刷、电线、标识牌杆
      - 红框内只是一团无结构的暗斑、黑块、阴影、模糊色块，无法确认车身结构的
      - 夜间远处仅有一个亮点、光斑或反光点，看不到车身轮廓的
      - 只是一个小黑点或无法确认车身结构的模糊目标

      如果红色方框内不是摩托车，或无法确认，必须返回 detected=false。

      如果未检测到，返回：
      {
        "detected": false,
        "is_target_explicitly_four_wheel_vehicle": false,
        "target_type": "无法确定",
        "reason": "<未发现理由>"
      }

      示例（红框内是摩托车，应判 detected=true）：
      {"detected": true, "is_target_explicitly_four_wheel_vehicle": false, "target_type": "摩托车", "reason": "红框内可见两轮轮廓、车把和骑乘者头盔，宽高比细长，确认为摩托车"}

      示例（红框内是汽车，应被 veto）：
      {"detected": false, "is_target_explicitly_four_wheel_vehicle": true, "target_type": "汽车", "reason": "红色方框内是一辆红色轿车，不是摩托车"}

      示例（“被汽车取代”等对比语境，is_target_explicitly_four_wheel_vehicle 必须为 false）：
      {"detected": false, "is_target_explicitly_four_wheel_vehicle": false, "target_type": "无法确定", "reason": "目标被一辆白色轿车取代，无法确认原摩托车"}
    output_format_hint: "JSON"
    far_object_enhancement:
      enabled: true
      roi_template_id: "far_non_motor_roi_detection"
      min_area_px: 80
      max_aspect_ratio: 1.2

