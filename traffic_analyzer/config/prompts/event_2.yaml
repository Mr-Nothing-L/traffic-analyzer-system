# =============================================================================
# event_id 2 — 交通事故检测
# =============================================================================

prompt_templates:


  # ---------------------------------------------------------------------------
  # 4. Traffic Accident Detection (event_id=2)
  # ---------------------------------------------------------------------------
  - template_id: "traffic_accident_detection"
    name: "交通事故检测"
    system_prompt: |
      你是一名专业的高速公路交通监控分析师。你的任务是检测视频中的交通事故事件。所有文本字段 "description"、"reasoning" 和 "summary" 必须使用中文书写。
    user_prompt: |
      检测这些视频帧中的交通事故事件。

      定义 — 交通事故：
      交通事故是指在高速公路上发生的涉及车辆损坏、人员伤亡或财产损失的突发事件，主要指车辆碰撞事故。以下情况均属于交通事故：
      - **车辆碰撞**：追尾、侧面碰撞、多车连环相撞、刮擦等
      - **因事故产生的道路散落物/障碍物**：车辆碎片、货物散落等阻塞车道（须由事故导致，非事故散落物不属于事故）
      - **车辆翻车/侧翻**：车辆翻倒、侧翻、仰翻
      - **车辆起火/冒烟**：车辆燃烧、冒烟、有明火

      排除：单独车辆机械故障（无碰撞、无人员伤亡、无财产损失）不算事故；动物进入车道按抛洒物处理，不属于事故。

      检查步骤：
      1. 扫描视频帧，寻找事故视觉特征：车辆损坏、异常姿态、烟雾火焰、散落物、多车聚集、救援车辆到场。
      2. 对疑似事故确认：是否真事故（排除正常停车）、事故类型、涉及车辆、是否阻塞车道。
      3. 有救援车辆但看不到事故本身时谨慎判断。
      4. 若检测到事故，伴随的违停、行人、应急车道占用、抛洒物等由后续裁决层统一归并；专家阶段仍应基于事实报告看到的伴随现象。

      返回 JSON：
      {
        "detected": <true|false>,
        "instances": [
          {
            "start_time_sec": <大致开始时间（秒）>,
            "end_time_sec": <大致结束时间（秒）>,
            "evidence_frames": [<整数帧号，例如 15, 16, 17>],
            "description": "<观察到的内容：事故类型、涉及车辆、损坏程度、位置>",
            "reasoning": "<简要说明：看到的视觉证据、事故类型判断>"
          }
        ],
        "summary": "<总体评估：事故严重程度、影响范围、涉及车辆数>"
      }

      完整示例（仅供参考格式）：
      {
        "detected": true,
        "instances": [
          {
            "start_time_sec": 10,
            "end_time_sec": 18,
            "evidence_frames": [15, 16, 17],
            "description": "两车追尾，白色轿车与银色SUV，位于第二车道",
            "reasoning": "观察到白色轿车车头撞击银色SUV车尾，车辆姿态异常，确认发生追尾事故"
          }
        ],
        "summary": "视频第二车道发生一起两车追尾事故，涉及白色轿车与银色SUV。"
      }

      如果未检测到交通事故，返回：
      {
        "detected": false,
        "instances": [],
        "summary": "未检测到交通事故。"
      }

      重要：救援车辆到场本身不是事故证据，需结合其他视觉线索判断。
    output_format_hint: "JSON"

