# =============================================================================
# 交通事件类别配置 (Traffic Event Categories)
# =============================================================================
# [文件说明]
# 作用:定义全部交通事件类别(event_categories),含事件编号/名称、检测模式、
#      prompt_template_id、置信度阈值、判定定义,以及跨事件推理规则和裁决规则;
#      二进制编码输出的位序即对应 event_id 1..11。
# 影响:由 core/config_manager.py 加载并校验(与 annotation_spec.yaml 事件 ID 一致性),
#      经 get_event_categories()/get_active_event_categories() 供 expert_agent 与
#      pipeline_steps.py 专家分发、sft_label_rewrite.py、grounding_verification.py、
#      report_generator、batch_evaluate.py 及 web/evidence_api.py 使用。
#
# 事件定义 / 检测模式 / Prompt 模板 / 裁决规则 全部通过 YAML 配置。
# 新增事件无需改代码，只需在本文件追加并运行 validate-config；
# agent 侧消费 event_contract.json 生成物，追加事件后另需运行
# scripts/gen_agent_event_contract.py 重新生成（pytest --check 守护同步）。
#
# 输出格式：二进制编码 {bit_1_bit_2_..._bit_11}
# 位序 = 全局事件编号 1..11（标注文档 v4.5 的 action 编号；编号 9 = 正常占位，恒为 0）。
# 示例：{1_0_1_0_0_0_0_0_0_1_0} 表示事件 1、3、10 被检出。
# =============================================================================

# -----------------------------------------------------------------------------
# 检测模式说明
# -----------------------------------------------------------------------------
# expert_agent → 独立专家 Agent 检测。必需字段：prompt_template_id
#                每位专家只负责事实识别（看到就报），不做排除判断。
#                最终排除/冲突裁决由 AdjudicationStep 处理。
#
# 关闭事件请用 is_active: false，不要注释整段（保留二进制位数）。
# -----------------------------------------------------------------------------

event_categories:
  # --- event_id: 1 | 违法停车 (A) ---
  - event_id: 1
    event_code: "A"
    name: "Illegal Parking"
    name_zh: "违法停车"
    description: "机动车在禁止停车区域静止或停放"
    detection_mode: "expert_agent"
    prompt_template_id: "illegal_parking_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      违法停车判定规则（与标注文档 v4.5 一致）：
      1. 只针对机动车——摩托车、非机动车静止时不判定为违法停车。
      2. 车辆由行驶状态变为静止状态（静止持续时间默认 10s，但无需在视频中完整体现，只要能看到车辆处于静止/停放状态即可判定）。
      3. 事件区域：行车道、应急车道、导流区、路肩。
      4. 涉及交通事故的场景中，静止车辆属于事故，不重复判定为违法停车。
      5. 施工区域内静止的施工保障车辆仍判定为违法停车。
      6. 机动车在应急车道内静止（含一直压在应急车道线上）时，同时构成违法停车与应急车道占用，两者不互斥、需同时标注。

  # --- event_id: 2 | 应急车道占用 (B) ---
  - event_id: 2
    event_code: "B"
    name: "Emergency Lane Occupancy"
    name_zh: "应急车道占用"
    description: "车辆进入、停止、占用或在应急车道内行驶"
    detection_mode: "expert_agent"
    prompt_template_id: "emergency_lane_occupancy_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      应急车道（路肩）特征：
      - 位于道路最外侧边缘，通常由白色实线与主车道分隔
      - 路面颜色/纹理可能与主车道不同
      - 宽度通常比标准车道窄
      - 可能有"应急车道"标志或隆声带
      - 匝道出入口处的白色/黄色网状实线导流区也属于应急车道
      - 中央分隔带/中央隔离带/绿化带/护栏不属于应急车道，停在其附近的车辆不计入占用

      判定规则（与标注文档 v4.5 一致）：
      1. 只针对机动车——行人与摩托车在应急车道不算占用；车辆进入、行驶、停止或停放于应急车道/导流区内均构成占用（停留时间默认 10s、行进距离默认 5 米，无需在视频中完整体现，能看到占用或停车即可判定）。
      2. 机动车在应急车道内静止时，同时构成应急车道占用与违法停车，两者不互斥、需同时标注。
      3. 车辆在应急车道内逆行时，需同时标注逆行。
      4. 施工区域内车辆占用应急车道无需标注；交通事故涉及的占用无需标注。

  # --- event_id: 3 | 交通事故 (C) ---
  - event_id: 3
    event_code: "C"
    name: "Traffic Accident"
    name_zh: "交通事故"
    description: "车辆碰撞、翻车、起火、散落物等突发事件"
    detection_mode: "expert_agent"
    prompt_template_id: "traffic_accident_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      交通事故包括：车辆碰撞（追尾、侧碰、刮擦、多车连环相撞）、翻车/侧翻、起火/冒烟、因事故产生的路面散落物等。
      判定补充（标注文档 v4.5）：同时满足"连续停车数量超过 2 台（但不满足拥堵条件）"与"行人数量超过 1 人"，或车辆发生倾覆时，判定为事故；警车+路锥+一地碎片等组合可按正常理解判定为事故。
      排除：单独车辆机械故障（无碰撞、无人员伤亡、无财产损失）不算事故；动物进入车道按抛洒物处理，不属于事故；救援车辆到场本身不是事故证据，需结合车辆损坏、散落物等其他视觉线索判断。
      事故发生区域包括行车道、应急车道、导流区和路肩。

  # --- event_id: 4 | 高速公路行人出现 (D) ---
  - event_id: 4
    event_code: "D"
    name: "Person Presence in Highway"
    name_zh: "高速公路行人出现"
    description: "行人或滞留驾乘人员出现在高速公路限制区域"
    detection_mode: "expert_agent"
    prompt_template_id: "pedestrian_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      行人出现：高速公路车道、路肩、中央隔离带、匝道等区域行走或站立的普通人，包括穿越高速者、因车辆故障或事故滞留路面的驾乘人员。
      排除：
      - 施工人员在施工区域内行走/作业时，不判定为行人事件；
      - 交通事故涉及的行人无需标注（由事故统一标注）；
      - 骑乘姿态的人员（骑摩托车、电动车、自行车、三轮车）与四轮机动车内的人员不算行人；
      - 人员必须实际站在路面或路肩上，站在车上或车尾平台未落地的不算；
      - 进入车道的动物（牛、羊、野猪等）不属于本事件，按抛洒物处理。
      注意：行人目标可能很小（验收边界：不小于 25×50 像素），远处的直立人形轮廓也需仔细排查。

  # --- event_id: 5 | 摩托车出现 (E) ---
  - event_id: 5
    event_code: "E"
    name: "Motorcycle Presence"
    name_zh: "摩托车出现"
    description: "两轮/三轮摩托车出现在高速公路上"
    detection_mode: "expert_agent"
    prompt_template_id: "non_motor_vehicle_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      摩托车出现：两轮/三轮摩托车在高速公路上行驶或静止。
      注意：电动自行车、自行车、三轮车不属于摩托车，不判定为本事件。

  # --- event_id: 6 | 严重拥堵 (F) ---
  - event_id: 6
    event_code: "F"
    name: "Heavy Congestion"
    name_zh: "拥堵"
    description: "单车道或多车道通行能力下降的交通状态"
    detection_mode: "expert_agent"
    prompt_template_id: "heavy_congestion_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      拥堵：道路上出现单车道或多车道通行能力下降、影响整体通行效率的交通状态。
      特征：车辆速度下降、车间距变小、出现排队或走走停停；单条车道通行能力下降也按拥堵标注；出入匝道口的拥堵同样属于拥堵。
      无需具体阈值，与正常车流密集不同（车流多但车速正常、车间距正常、无排队，不算拥堵）。
      注意：拥堵导致的车辆停止现象只标注拥堵，不重复判定为违法停车。

  # --- event_id: 7 | 道路施工 (G) ---
  - event_id: 7
    event_code: "G"
    name: "Road Construction"
    name_zh: "道路施工"
    description: "道路施工或维护作业区域"
    detection_mode: "expert_agent"
    prompt_template_id: "road_construction_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      道路施工判定（v4.5）：
      - 有已放置于地面的交通锥/隔离栏布置形成的作业区/车道封闭，且至少有一项：施工人员、工程车辆、车道封闭引导
      - 或落地施工标志牌 + 施工人员/工程车辆
      - 或正在路面作业的施工设备并伴随地面布置
      细则：
      - 交通锥、施工标志牌必须落地才构成证据；仅放在施工车辆车顶、车厢内或未落地的锥桶不算；
      - 孤立的单个锥桶不构成施工作业区，需多个连续/成组布置，或隔离栏形成车道封闭；
      - 施工车辆正常行驶不算施工。
      排除：单一清扫车日常清洁；应急救援车辆；施工车辆缓行/停车、人员仅捡垃圾等明显非施工操作；仅有施工人员+黄色工程车但无任何地面布置（落地锥桶/隔离栏/落地标志牌）不算施工。

  # --- event_id: 8 | 车辆逆行/倒车 (H) ---
  - event_id: 8
    event_code: "H"
    name: "Vehicle Reversing"
    name_zh: "车辆逆行/倒车"
    description: "车辆移动方向与车道正常流向相反"
    detection_mode: "expert_agent"
    prompt_template_id: "direct_reversing_detection"
    confidence_threshold: 0.8
    is_active: true
    definition: |
      车辆逆行/倒车：机动车移动方向与所在车道正常流向相反（含在应急车道内逆行）。
      判定依据：以车辆相对于路面标线、护栏等固定参照物的实际位移方向为准；白色倒车灯亮可作为辅助证据。
      不要仅凭车头朝向判断——车头朝向相反但无反向位移（如静止车辆）不判定为逆行。
      排除：静止车辆；施工区域内车辆往返施工不算逆行。

  # --- event_id: 10 | 抛洒物 (J) ---
  - event_id: 10
    event_code: "J"
    name: "Thrown Objects"
    name_zh: "抛洒物"
    description: "车道内可能影响通行的遗落异物"
    detection_mode: "expert_agent"
    prompt_template_id: "thrown_object_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      抛洒物：遗落至车道内可能影响车辆通行的异物（塑料袋、瓶子、木板、泥土等）；"对车辆正常通行造成干扰风险"不是判定的必要条件，遗落即可。
      事件区域：行车道、应急车道、匝道、导流区均算。
      包含规则：
      - 进入车道的动物（牛、羊、野猪等）按抛洒物处理；
      - 施工物品（锥桶、施工标志牌、工具等）散落到施工区域以外的车道内，按抛洒物处理；
      - 三角警示牌等标识牌：起到提醒作用时不标；无提醒作用（倒地、不在事故车后正常放置、被风吹倒）按抛洒物处理。
      排除：施工区域内正常放置的物品；事故碎片（由事故统一标注）；路面正常设施（标线、井盖、排水口）；车辆正常装载物。
      注意：抛洒物可能很小（验收边界：不小于 10×10 像素），即使很小的可疑物体也要报告。

  # --- event_id: 11 | 实线变道 (K) ---
  - event_id: 11
    event_code: "K"
    name: "Lane Change over Solid Line"
    name_zh: "实线变道"
    description: "车辆跨越实线标线变道"
    detection_mode: "expert_agent"
    prompt_template_id: "lane_change_solid_detection"
    confidence_threshold: 0.7
    is_active: true
    definition: |
      实线变道：机动车主动跨越白色/黄色实线从一个车道驶入另一个车道；车身超过实线一半即可认定为变道。
      包含规则：
      - 应急车道方向变道同样属于实线变道：从应急车道/路肩跨越实线进入行车道，或从行车道跨越实线进入应急车道；
      - 压越导流线（V形/斜线填充区域）按实线变道处理；
      - 匝道车辆跨越实线强行汇入主路判定为违规。
      排除：车轮短暂压线但车身仍在原车道；跨越虚线变道；匝道经虚线/渐变段的正常汇入；施工区域内涉及的实线变道；交通事故涉及的实线变道。

# =============================================================================
# 裁决规则 (Adjudication Rules)
# =============================================================================
# 这些规则嵌入 AdjudicationStep 的 prompt 中，由 VLM 根据业务语义进行裁决。
# 不是代码执行的硬规则，而是指导 VLM 做出符合业务要求的判断。
#
# 字段说明：
#   rule_id:   规则唯一标识
#   name:      规则名称（供日志使用）
#   description: 规则详细描述（嵌入 prompt 给 VLM 阅读）
#   priority:  优先级（数值越大越优先），用于规则排序
# =============================================================================

adjudication_rules:
  - rule_id: "emergency_parking_both"
    name: "应急车道静止触发双事件"
    description: "当车辆在应急车道上静止停放时，应同时触发'违法停车'和'应急车道占用'两个事件。这两个事件不是互斥的，可以同时存在。"
    priority: 95

