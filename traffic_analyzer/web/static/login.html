<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 高速交通事件分析台</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 登录页专属样式(共用 style.css 的配色变量与缝合像素字体) */
    body {
      align-items: center;
      justify-content: center;
      overflow: auto;
      /* 浅色底上铺一层像素网格点,呼应像素风 */
      background-image:
        linear-gradient(rgba(42, 38, 32, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 38, 32, 0.045) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .login-card {
      position: relative;
      width: min(380px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px 28px;
      font-family: var(--pixel);
      /* 进入:减速曲线,无过冲 */
      animation: modal-in 0.25s ease-out;
    }
    /* 常态轻投影;表单聚焦(focus-within)时升回重投影 */
    .login-card:focus-within { box-shadow: var(--shadow-hover); }

    /* 四角像素方块装饰:1px 基块 + box-shadow 逐像素复制 */
    .px-deco {
      position: absolute;
      width: 6px;
      height: 6px;
      pointer-events: none;
    }
    .px-deco.tl { top: 10px; left: 10px; color: var(--accent); }
    .px-deco.tr { top: 10px; right: 10px; color: var(--sage); }
    .px-deco.bl { bottom: 10px; left: 10px; color: var(--blue); }
    .px-deco.br { bottom: 10px; right: 10px; color: var(--accent); }
    .px-deco::before {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: currentColor;
      box-shadow:
        12px 0 0 0 currentColor,
        0 12px 0 0 currentColor,
        12px 12px 0 0 var(--border),
        24px 0 0 0 var(--border),
        0 24px 0 0 var(--border);
    }
    .px-deco.tr::before { right: 0; }
    .px-deco.bl::before { bottom: 0; }
    .px-deco.br::before { right: 0; bottom: 0; }

    .login-logo {
      display: flex;
      justify-content: center;
      font-size: 28px;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 10px;
    }
    .login-title {
      text-align: center;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0.02em;
      margin: 0 0 4px;
    }
    .login-sub {
      text-align: center;
      font-size: 12.5px;
      color: var(--text2);
      margin: 0 0 24px;
    }

    .login-field { margin-bottom: 14px; }
    .login-field label {
      display: block;
      font-size: 12.5px;
      color: var(--text2);
      margin-bottom: 5px;
    }
    .login-field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .login-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .login-error {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      padding: 7px 10px;
      margin-bottom: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 10px 0;
      font-size: 15px;
      letter-spacing: 0.35em;
      text-indent: 0.35em; /* letter-spacing 末字符补偿,保持视觉居中 */
    }
    .login-btn:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <div class="login-card">
    <span class="px-deco tl"></span>
    <span class="px-deco tr"></span>
    <span class="px-deco bl"></span>
    <span class="px-deco br"></span>

    <div class="login-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17"/><path d="M9.5 9.5V20.5"/><path d="M15 3.5v6"/><path d="M9.5 15H20.5"/></svg></div>
    <h1 class="login-title">高速交通事件分析台</h1>
    <p class="login-sub">请登录后继续</p>

    <form id="login-form" method="post" action="/api/auth/login">
      <div class="login-error" id="login-error" hidden></div>
      <div class="login-field">
        <label for="login-username">用户名</label>
        <input id="login-username" name="username" type="text"
               autocomplete="username" spellcheck="false" required autofocus>
      </div>
      <div class="login-field">
        <label for="login-password">密码</label>
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button id="login-btn" class="btn btn-primary login-btn" type="submit">登 录</button>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var errBox = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');

      function showError(msg) {
        errBox.textContent = msg;
        errBox.hidden = false;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: form.username.value.trim(),
              password: form.password.value,
            }),
          });
          if (res.ok) {
            location.href = '/';
            return;
          }
          let detail = '登录失败(HTTP ' + res.status + ')';
          try {
            const j = await res.json();
            if (j && j.detail) detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail);
          } catch (e2) { /* 非 JSON 响应:保留默认文案 */ }
          showError(detail);
        } catch (err) {
          showError('网络错误:' + err.message);
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
