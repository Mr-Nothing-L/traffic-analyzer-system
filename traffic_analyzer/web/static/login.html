<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 高速交通事件分析台</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card">
    <span class="px-deco tl"></span>
    <span class="px-deco tr"></span>
    <span class="px-deco bl"></span>
    <span class="px-deco br"></span>

    <div class="login-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17"/><path d="M9.5 9.5V20.5"/><path d="M15 3.5v6"/><path d="M9.5 15H20.5"/></svg></div>
    <h1 class="login-title">高速交通事件分析台</h1>
    <p class="login-sub">请登录后继续</p>

    <form id="login-form" method="post" action="/api/auth/login">
      <div class="login-error" id="login-error" hidden></div>
      <div class="login-field">
        <label for="login-username">用户名</label>
        <input id="login-username" name="username" type="text"
               autocomplete="username" spellcheck="false" required autofocus>
      </div>
      <div class="login-field">
        <label for="login-password">密码</label>
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button id="login-btn" class="btn btn-primary login-btn" type="submit">登 录</button>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var errBox = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');

      function showError(msg) {
        errBox.textContent = msg;
        errBox.hidden = false;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: form.username.value.trim(),
              password: form.password.value,
            }),
          });
          if (res.ok) {
            location.href = '/';
            return;
          }
          let detail = '登录失败(HTTP ' + res.status + ')';
          try {
            const j = await res.json();
            if (j && j.detail) detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail);
          } catch (e2) { /* 非 JSON 响应:保留默认文案 */ }
          showError(detail);
        } catch (err) {
          showError('网络错误:' + err.message);
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
