<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高速交通事件分析台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="usability.css">
</head>
<body>
  <header id="toolbar">
    <div class="tb-row">
      <div class="tb-brand">
        <span class="tb-logo">▦</span>
        <span class="tb-title">高速交通事件分析台</span>
        <span id="mock-badge" class="mock-badge" hidden>MOCK</span>
      </div>
      <div class="tb-workspace">
        <button id="btn-workspace" class="btn btn-ghost" title="浏览服务器目录选择工作区">
          <span class="ws-icon">⌂</span>
          <span class="ws-label" id="ws-label">选择工作区…</span>
          <span id="ws-path" class="ws-path" hidden></span>
        </button>
      </div>
      <div class="tb-spacer"></div>
      <button id="btn-infer" class="btn btn-primary" disabled>开始推理</button>
      <button id="btn-dashboard" class="btn btn-ghost" title="查看 GT 与模型检出的一致性看板">数据看板</button>
      <div id="user-area" class="user-area" hidden>
        <button id="user-avatar" class="user-avatar" title="账号"></button>
        <div id="user-pop" class="user-pop" hidden>
          <div class="user-pop-row"><span class="user-pop-key">用户名</span><span id="user-pop-name">-</span></div>
          <div class="user-pop-row"><span class="user-pop-key">登录时间</span><span id="user-pop-time">-</span></div>
          <div class="user-pop-row"><span class="user-pop-key">来源 IP</span><span id="user-pop-ip">-</span></div>
          <button id="btn-logout" class="btn btn-ghost btn-sm user-pop-logout">登出</button>
        </div>
      </div>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="side-head">
        <span class="side-title">工作区文件</span>
        <label class="side-all" title="全选/取消全选">
          <input type="checkbox" id="check-all">
        </label>
      </div>
      <div class="side-filter">
        <input id="side-filter-input" type="text" spellcheck="false" placeholder="过滤视频…">
        <select id="side-sort-select" title="排序方式">
          <option value="name">名称</option>
          <option value="mtime">修改时间</option>
          <option value="size">大小</option>
          <option value="status">状态</option>
        </select>
      </div>
      <div id="video-list" class="video-list">
        <div class="side-empty">设置工作区后列出视频</div>
      </div>
    </aside>
    <div id="splitter" title="拖动调整侧栏宽度,双击复位"></div>
    <main id="main"></main>
  </div>

  <div id="dir-modal" class="dir-backdrop" hidden>
    <div class="dir-dialog" role="dialog" aria-modal="true" aria-labelledby="dir-modal-title" tabindex="-1">
      <div class="dir-head">
        <span class="dir-title" id="dir-modal-title">选择工作区</span>
        <button id="dir-close" class="dir-close" title="关闭 (Esc)">✕</button>
      </div>
      <div class="dir-recent">
        <label class="dir-recent-label" for="dir-recent-select">最近使用</label>
        <select id="dir-recent-select" class="dir-recent-select"></select>
      </div>
      <div class="dir-pathbar">
        <div id="dir-crumbs" class="dir-crumbs"></div>
        <input id="dir-input" type="text" spellcheck="false" placeholder="输入绝对路径,回车跳转" hidden>
        <button id="dir-edit" class="btn btn-ghost btn-sm" title="手动输入路径">✎</button>
      </div>
      <div id="dir-list" class="dir-list"></div>
      <div id="dir-applying" class="dir-state" hidden>
        <div class="dir-spinner"></div>正在加载工作区,请稍候…
      </div>
      <div class="dir-foot">
        <span id="dir-selected" class="dir-selected"></span>
        <button id="dir-cancel" class="btn btn-ghost">取消</button>
        <button id="dir-confirm" class="btn btn-primary">选择此文件夹</button>
      </div>
    </div>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
