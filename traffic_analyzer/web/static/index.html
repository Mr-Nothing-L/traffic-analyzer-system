<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高速交通事件分析台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="tb-row">
      <div class="tb-brand">
        <span class="tb-logo">▦</span>
        <span class="tb-title">高速交通事件分析台</span>
        <span id="mock-badge" class="mock-badge" hidden>MOCK</span>
      </div>
      <div class="tb-workspace">
        <button id="btn-workspace" class="btn btn-ghost" title="浏览服务器目录选择工作区">
          <span class="ws-icon">⌂</span>
          <span id="ws-path" class="ws-path">选择工作区…</span>
        </button>
      </div>
      <div class="tb-spacer"></div>
      <button id="btn-infer" class="btn btn-primary" disabled>开始推理</button>
      <button id="btn-evaluate" class="btn btn-ghost" disabled>精度评估</button>
    </div>
    <div id="progress-dock" class="progress-dock" hidden></div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="side-head">
        <span class="side-title">工作区视频</span>
        <label class="side-all" title="全选/取消全选">
          <input type="checkbox" id="check-all">
        </label>
      </div>
      <div id="video-list" class="video-list">
        <div class="side-empty">设置工作区后列出视频</div>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <div id="dir-modal" class="dir-backdrop" hidden>
    <div class="dir-dialog" role="dialog" aria-modal="true" aria-labelledby="dir-modal-title" tabindex="-1">
      <div class="dir-head">
        <span class="dir-title" id="dir-modal-title">选择工作区</span>
        <button id="dir-close" class="dir-close" title="关闭 (Esc)">✕</button>
      </div>
      <div class="dir-pathbar">
        <div id="dir-crumbs" class="dir-crumbs"></div>
        <input id="dir-input" type="text" spellcheck="false" placeholder="输入绝对路径,回车跳转" hidden>
        <button id="dir-edit" class="btn btn-ghost btn-sm" title="手动输入路径">✎</button>
      </div>
      <div id="dir-list" class="dir-list"></div>
      <div class="dir-foot">
        <span id="dir-selected" class="dir-selected"></span>
        <button id="dir-cancel" class="btn btn-ghost">取消</button>
        <button id="dir-confirm" class="btn btn-primary">选择此文件夹</button>
      </div>
    </div>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
